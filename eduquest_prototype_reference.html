<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduQuest — Student Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f8f9fa;
  --card: #ffffff;
  --text: #202124;
  --text-secondary: #5f6368;
  --border: #dadce0;

  --blue: #1a73e8;
  --blue-dark: #1765cc;
  --blue-soft: #e8f0fe;
  --orange: #fbbc04;
  --orange-soft: #fef7e0;
  --red: #ea4335;
  --green: #34a853;
  --teal: #12b5cb;
  --indigo: #9334e6;

  --c-math: #1a73e8;
  --c-sci: #34a853;
  --c-eng: #fbbc04;
  --c-soc: #12b5cb;
  --c-tel: #ea4335;

  --radius: 12px;
  --shadow: 0 1px 2px rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15);
  --font-display: "Roboto", Arial, sans-serif;
  --font: "Roboto", Arial, sans-serif;

  --badge-math-text: var(--blue-dark);
  --badge-sci-text: #1e8e3e;
  --badge-eng-text: #b06000;
  --badge-soc-text: #0b8394;
  --badge-tel-text: #c5221f;
  --gold-text: #b06000;
  --gray-soft: #e8eaed;
}
body[data-theme="dark"] {
  --bg: #202124;
  --card: #292a2d;
  --text: #e8eaed;
  --text-secondary: #9aa0a6;
  --border: #3c4043;
  --blue-soft: rgba(138,180,248,.16);
  --orange-soft: rgba(253,214,99,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 1px 3px 1px rgba(0,0,0,.4);

  --badge-math-text: #8ab4f8;
  --badge-sci-text: #81c995;
  --badge-eng-text: #fdd663;
  --badge-soc-text: #78d9ec;
  --badge-tel-text: #f28b82;
  --gold-text: #fdd663;
  --gray-soft: #3c4043;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; }
h1,h2,h3,h4 { font-family: var(--font-display); font-weight: 500; letter-spacing: 0; margin: 0 0 .3em; color: var(--text); }
a { color: var(--blue); cursor: pointer; text-decoration: none; }
p { margin: 0; }
button { font-family: var(--font); }

.frame { border: 1px solid var(--border); border-radius: 22px; overflow: hidden; max-width: 1180px; margin: 0 auto; box-shadow: var(--shadow); }
.app-shell { min-height: 640px; display: flex; background: var(--bg); }
.app-shell.auth-mode { display: block; background: var(--bg); min-height: 640px; }

/* ---------- sidebar ---------- */
.sidebar { width: 216px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border); padding: 22px 16px; display: flex; flex-direction: column; gap: 22px; }
.sidebar .brand { display: flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 1.12rem; color: var(--text); padding: 0 6px; }
.sidebar .brand .logo-badge { width: 30px; height: 30px; border-radius: 9px; background: var(--blue); display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
.sidebar .brand .logo-badge svg { width: 17px; height: 17px; }
.side-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.side-link { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 11px; color: var(--text-secondary); font-weight: 600; font-size: .88rem; border: none; background: none; cursor: pointer; width: 100%; text-align: left; }
.side-link svg { width: 18px; height: 18px; flex-shrink: 0; }
.side-link:hover { background: var(--bg); color: var(--text); text-decoration: none; }
.side-link.active { background: var(--blue-soft); color: var(--blue-dark); }
.sidebar .side-foot { border-top: 1px solid var(--border); padding-top: 12px; }
.side-link.logout { color: #d64d4d; }
.side-link.logout:hover { background: #fdeaea; }

/* ---------- topbar / main ---------- */
.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 26px; background: var(--card); border-bottom: 1px solid var(--border); }
.topbar .search-pill { display: flex; align-items: center; gap: 8px; background: var(--bg); border-radius: 980px; padding: 8px 16px; color: var(--text-secondary); font-size: .86rem; min-width: 220px; }
.topbar .search-pill svg { width: 15px; height: 15px; flex-shrink: 0; }
.topbar .search-pill input { border: none; background: none; outline: none; font-family: var(--font); font-size: .86rem; color: var(--text); width: 100%; }
.topbar .top-right { display: flex; align-items: center; gap: 16px; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: none; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; position: relative; }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn .dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--red); border: 1.5px solid #fff; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 4px 4px 4px 12px; border: none; border-left: 1px solid var(--border); background: none; cursor: pointer; border-radius: 8px; font-family: var(--font); }
.user-chip:hover { background: var(--bg); }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: .85rem; flex-shrink: 0; }
.user-chip .u-name { font-size: .85rem; font-weight: 700; line-height: 1.1; text-align: left; }
.user-chip .u-role { font-size: .72rem; color: var(--text-secondary); text-align: left; }

.page-scroll { flex: 1; overflow-y: auto; padding: 24px 26px 40px; }

/* ---------- auth pages ---------- */
.auth-center { min-height: 640px; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.auth-card-wrap { width: 100%; max-width: 380px; }
.auth-logo { display: flex; align-items: center; justify-content: center; gap: 9px; font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; margin-bottom: 26px; color: var(--text); }
.auth-logo .logo-badge { width: 34px; height: 34px; border-radius: 10px; background: var(--blue); display: flex; align-items: center; justify-content: center; color: #fff; }
.auth-logo .logo-badge svg { width: 19px; height: 19px; }

/* ---------- generic card ---------- */
.card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-head h3 { font-size: 1rem; margin: 0; }
.card-head a.view-all { font-size: .8rem; font-weight: 700; }

.page-head { margin-bottom: 22px; }
.eyebrow { display: block; font-size: .74rem; font-weight: 700; color: var(--blue); margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase; }
.page-head h2 { font-size: 1.6rem; }
.page-head p { color: var(--text-secondary); margin-top: 6px; font-size: .92rem; line-height: 1.5; }

.filter-bar { display: flex; gap: 14px; flex-wrap: wrap; }
.form-group { margin-bottom: 4px; flex: 1; min-width: 150px; }
.form-group label { display: block; margin-bottom: 6px; font-weight: 700; font-size: .78rem; color: var(--text-secondary); }
.form-group input, .form-group select {
  width: 100%; padding: 10px 13px; border-radius: 11px; border: 1.5px solid var(--border);
  background: var(--bg); font-family: var(--font); font-size: .92rem; color: var(--text);
}
.form-group input:focus, .form-group select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,115,232,.2); }

.btn-primary {
  background: var(--blue); color: #fff; border: none; padding: 10px 24px; border-radius: 999px;
  cursor: pointer; font-family: var(--font); font-size: .9rem; font-weight: 500; letter-spacing: .01em; box-shadow: none; transition: box-shadow .15s ease, background .15s ease;
}
.btn-primary:hover { background: var(--blue-dark); box-shadow: 0 1px 2px rgba(60,64,67,.3), 0 1px 3px 1px rgba(60,64,67,.15); }
.btn-secondary {
  background: transparent; color: var(--blue); border: 1px solid var(--border); padding: 9px 20px;
  border-radius: 999px; cursor: pointer; font-weight: 500; font-family: var(--font); font-size: .9rem;
}
.btn-secondary:hover { background: var(--blue-soft); }
.btn-secondary.done { color: var(--green); border-color: var(--green); cursor: default; background: none; }
.btn-light { background: rgba(255,255,255,.18); color: #fff; border: 1px solid rgba(255,255,255,.55); padding: 9px 18px; border-radius: 999px; font-weight: 500; font-size: .85rem; cursor: pointer; }

.badge { display: inline-block; background: var(--bg); color: var(--text-secondary); padding: 4px 12px; border-radius: 980px; font-size: .7rem; font-weight: 700; margin-right: 6px; }
.badge.gold { background: var(--orange-soft); color: var(--gold-text); }
.badge.green { background: rgba(40,199,111,.14); color: var(--badge-sci-text); }
.badge-math { background: rgba(74,108,247,.13); color: var(--badge-math-text); }
.badge-science { background: rgba(40,199,111,.14); color: var(--badge-sci-text); }
.badge-english { background: var(--orange-soft); color: var(--badge-eng-text); }
.badge-social { background: rgba(0,207,232,.14); color: var(--badge-soc-text); }
.badge-telugu { background: rgba(255,107,107,.15); color: var(--badge-tel-text); }

.error-text { color: #e0245e; font-size: .84rem; margin-top: 10px; font-weight: 600; }
.success-text { color: var(--green); font-size: .88rem; margin-top: 10px; font-weight: 700; }

/* ---------- dashboard ---------- */
.dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; align-items: start; }
.welcome-card { background: var(--blue-soft); display: flex; align-items: center; justify-content: space-between; gap: 18px; box-shadow: none; border: 1px solid var(--border); }
.welcome-card h2 { font-size: 1.35rem; }
.welcome-card .wc-icon { width: 74px; height: 74px; border-radius: 20px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: var(--shadow); }
.welcome-card .wc-icon svg { width: 38px; height: 38px; color: var(--blue); }
.welcome-card p { color: var(--text-secondary); margin-top: 6px; font-size: .92rem; }
.hl-orange { color: var(--orange); font-weight: 800; }
.hl-blue { color: var(--blue); font-weight: 800; }

.two-col { display: grid; grid-template-columns: 1.15fr .85fr; gap: 20px; }
.progress-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.progress-row:not(:last-child) { border-bottom: 1px solid var(--border); }
.progress-row .pr-name { flex: 1; min-width: 0; }
.progress-row .pr-name .n { font-weight: 700; font-size: .87rem; display: block; }
.progress-row .track { height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; margin-top: 6px; }
.progress-row .fill { height: 100%; border-radius: 999px; }
.progress-row .pct-pill { flex-shrink: 0; font-size: .74rem; font-weight: 800; color: #fff; padding: 4px 11px; border-radius: 980px; min-width: 44px; text-align: center; }

.donut-wrap { display: flex; flex-direction: column; align-items: center; }
.donut { width: 168px; height: 168px; border-radius: 50%; display: flex; align-items: center; justify-content: center; position: relative; }
.donut::before { content: ""; position: absolute; inset: 16px; background: var(--card); border-radius: 50%; }
.donut .donut-label { position: relative; font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; }
.donut-legend { display: flex; gap: 18px; margin-top: 16px; }
.donut-legend span { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-secondary); font-weight: 600; }
.donut-legend .lg-dot { width: 9px; height: 9px; border-radius: 50%; }
.pill-tag { background: var(--orange-soft); color: var(--gold-text); font-size: .72rem; font-weight: 700; padding: 4px 12px; border-radius: 980px; }

.cta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.cta-card { border-radius: var(--radius); padding: 24px; color: #fff; }
.cta-card.orange { background: var(--red); }
.cta-card.blue { background: var(--blue); }
.cta-card h3 { color: #fff; font-size: 1.1rem; }
.cta-card p { color: rgba(255,255,255,.85); font-size: .86rem; margin: 6px 0 16px; }
.cta-links { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.cta-links li { display: flex; align-items: center; gap: 8px; font-size: .86rem; font-weight: 600; cursor: pointer; }
.cta-links li svg { width: 14px; height: 14px; }

.calendar-card .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.calendar-card .cal-head h4 { margin: 0; font-size: .96rem; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.cal-nav button:hover { background: var(--bg); }
.cal-nav svg { width: 13px; height: 13px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-grid .cal-dow { font-size: .68rem; font-weight: 700; color: var(--text-secondary); padding-bottom: 6px; }
.cal-grid .cal-day { font-size: .78rem; padding: 7px 0; border-radius: 8px; color: var(--text); }
.cal-grid .cal-day.muted { color: #d3d7e6; }
.cal-grid .cal-day.today { background: var(--blue); color: #fff; font-weight: 800; }

.lessons-panel .lp-item { border-radius: 14px; border: 1px solid var(--border); padding: 14px 14px 12px; margin-bottom: 12px; }
.lessons-panel .lp-item:last-child { margin-bottom: 0; }
.lessons-panel .lp-bar { height: 3px; border-radius: 3px; width: 46px; margin-bottom: 10px; }
.lessons-panel .lp-top { display: flex; align-items: center; justify-content: space-between; }
.lessons-panel .lp-name { font-weight: 700; font-size: .9rem; }
.lessons-panel .lp-sub { font-size: .74rem; color: var(--text-secondary); margin-top: 2px; }
.lp-go { width: 30px; height: 30px; border-radius: 50%; border: none; background: var(--text); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.lp-go svg { width: 14px; height: 14px; }
.lp-avatars { display: flex; margin-top: 12px; }
.lp-avatars span { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: .68rem; font-weight: 800; border: 2px solid #fff; margin-left: -8px; }
.lp-avatars span:first-child { margin-left: 0; }

/* ---------- subject progress / lessons grid (lessons page) ---------- */
.subject-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 20px; }
.subject-progress { background: var(--card); border-radius: 14px; padding: 15px 17px; box-shadow: var(--shadow); border-top: 4px solid var(--c-math); }
.subject-progress.sci { border-top-color: var(--c-sci); }
.subject-progress.eng { border-top-color: var(--c-eng); }
.subject-progress.soc { border-top-color: var(--c-soc); }
.subject-progress.tel { border-top-color: var(--c-tel); }
.subject-progress .sp-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.subject-progress .sp-name { font-weight: 700; font-size: .87rem; }
.subject-progress .sp-count { font-size: .74rem; color: var(--text-secondary); }
.progress-track { width: 100%; height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.progress-fill { height: 100%; border-radius: 999px; background: var(--blue); }
.progress-fill.complete { background: var(--green); }

.lesson-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.lesson-card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; position: relative; border-left: 5px solid var(--c-math); }
.lesson-card.sci { border-left-color: var(--c-sci); }
.lesson-card.eng { border-left-color: var(--c-eng); }
.lesson-card.soc { border-left-color: var(--c-soc); }
.lesson-card.tel { border-left-color: var(--c-tel); }
.lesson-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(27,37,89,.1); }
.lesson-card h3 { font-size: 1rem; margin-bottom: 6px; }
.lesson-card .excerpt { color: var(--text-secondary); font-size: .85rem; line-height: 1.45; margin: 0; }
.lesson-card .check { position: absolute; top: 16px; right: 16px; width: 22px; height: 22px; border-radius: 50%; background: var(--green); color: #fff; font-size: .7rem; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.empty-state { padding: 30px 22px; border: 2px dashed var(--border); border-radius: var(--radius); color: var(--text-secondary); text-align: center; background: var(--card); }

.lesson-reader { border-top: 4px solid var(--blue); }
.lesson-reader p { line-height: 1.7; font-size: 1rem; }
.lesson-reader .reader-actions { display: flex; gap: 10px; margin-top: 18px; align-items: center; flex-wrap: wrap; }
.lesson-summary-box { background: var(--blue-soft); color: var(--blue-dark); border-radius: 10px; padding: 12px 14px; font-size: .9rem; line-height: 1.5; margin-top: 12px; }
body[data-theme="dark"] .lesson-summary-box { color: var(--text); }

/* ---------- AI doubt-clarification chatbot ---------- */
.chat-fab { position: fixed; bottom: 26px; right: 26px; width: 56px; height: 56px; border-radius: 50%; background: var(--blue); color: #fff; border: none; box-shadow: 0 4px 14px rgba(26,115,232,.45); cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 40; }
.chat-fab svg { width: 26px; height: 26px; }
.chat-fab:hover { background: var(--blue-dark); }
.chat-panel { position: fixed; bottom: 94px; right: 26px; width: 340px; max-width: calc(100vw - 32px); height: 460px; max-height: calc(100vh - 140px); background: var(--card); border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; z-index: 41; border: 1px solid var(--border); }
.chat-head { background: var(--blue); color: #fff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.chat-head h4 { color: #fff; margin: 0; font-size: .95rem; }
.chat-head p { color: rgba(255,255,255,.85); font-size: .74rem; margin-top: 2px; }
.chat-head button { background: none; border: none; color: #fff; cursor: pointer; padding: 4px; opacity: .85; }
.chat-head button:hover { opacity: 1; }
.chat-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); }
.chat-msg { max-width: 85%; padding: 9px 13px; border-radius: 14px; font-size: .86rem; line-height: 1.45; white-space: pre-wrap; }
.chat-msg.user { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
.chat-msg.assistant { align-self: flex-start; background: var(--card); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.chat-msg.pending { align-self: flex-start; background: var(--card); color: var(--text-secondary); border: 1px solid var(--border); font-style: italic; }
.chat-empty { color: var(--text-secondary); font-size: .84rem; text-align: center; margin: auto; padding: 0 10px; line-height: 1.5; }
.chat-input-row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); flex-shrink: 0; background: var(--card); }
.chat-input-row textarea { flex: 1; resize: none; border: 1.5px solid var(--border); border-radius: 12px; padding: 9px 12px; font-family: var(--font); font-size: .86rem; background: var(--bg); color: var(--text); max-height: 70px; }
.chat-input-row textarea:focus { outline: none; border-color: var(--blue); }
.chat-send-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--blue); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.chat-send-btn:disabled { opacity: .5; cursor: default; }
.chat-send-btn svg { width: 16px; height: 16px; }
@media (max-width: 460px) {
  .chat-panel { right: 12px; left: 12px; width: auto; bottom: 84px; }
  .chat-fab { right: 16px; bottom: 16px; }
}

.quiz-progress { display: flex; gap: 6px; margin-bottom: 22px; }
.quiz-progress .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
.quiz-progress .dot.answered { background: var(--blue); }
.quiz-question { margin-bottom: 26px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
.quiz-question:last-of-type { border-bottom: none; margin-bottom: 6px; }
.quiz-question .q-label { font-size: .74rem; color: var(--blue); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.q-text { font-size: 1.06rem; font-weight: 700; margin: 6px 0 14px; font-family: var(--font-display); }
.quiz-option { display: flex; align-items: center; gap: 12px; padding: 12px 15px; border: 1.5px solid var(--border); border-radius: 12px; margin-bottom: 8px; cursor: pointer; font-size: .92rem; transition: border-color .12s ease; }
.quiz-option:hover { border-color: var(--blue); }
.quiz-option .mark { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--border); flex-shrink: 0; }
.quiz-option.selected { border-color: var(--blue); background: var(--blue-soft); }
.quiz-option.selected .mark { border-color: var(--blue); background: var(--blue); }
.result-score { font-family: var(--font-display); font-size: 3.2rem; font-weight: 800; color: var(--orange); margin: 6px 0; letter-spacing: -0.02em; }
.card.dark { background: #1a73e8; color: #fff; }
.card.dark h2, .card.dark h3 { color: #fff; }

.podium { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.podium-slot { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 14px; padding: 16px; text-align: center; }
.podium-slot.you { border-color: var(--orange); }
.podium-slot .rank { font-size: .7rem; color: var(--orange); font-weight: 700; letter-spacing: .06em; }
.podium-slot .name { font-family: var(--font-display); font-size: 1rem; font-weight: 700; margin: 6px 0; }
.podium-slot .xp { font-size: .78rem; color: rgba(255,255,255,.7); }
.leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 13px 6px; border-bottom: 1px solid var(--border); font-size: .92rem; }
.leaderboard-row:last-child { border-bottom: none; }
.leaderboard-row .rank { font-weight: 700; color: var(--text-secondary); width: 28px; display: inline-block; }
.leaderboard-row.you { background: var(--blue-soft); border-radius: 12px; padding-left: 12px; padding-right: 12px; }
.leaderboard-row .points { color: var(--green); font-weight: 700; }

.profile-head { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
.profile-head .avatar { width: 60px; height: 60px; font-size: 1.3rem; }
.profile-head .p-name { font-size: 1.15rem; font-weight: 700; }
.profile-head .p-sub { font-size: .84rem; color: var(--text-secondary); margin-top: 2px; }
.profile-stats { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.danger-card { border: 1px solid rgba(234,67,53,.35); }
.danger-card h3 { color: var(--red); display: flex; align-items: center; gap: 8px; }
.danger-card h3 svg { width: 17px; height: 17px; }
.danger-card p { color: var(--text-secondary); font-size: .88rem; margin: 8px 0 16px; }
.btn-danger { background: var(--red); color: #fff; border: none; padding: 10px 22px; border-radius: 999px; font-weight: 500; font-size: .9rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn-danger:hover { background: #c5221f; }
.btn-danger svg { width: 15px; height: 15px; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 10px 22px; border-radius: 999px; font-weight: 500; font-size: .9rem; cursor: pointer; }
.confirm-box { background: rgba(234,67,53,.08); border: 1px solid rgba(234,67,53,.3); border-radius: 12px; padding: 14px 16px; margin-top: 4px; }
.confirm-box p { color: var(--text); font-weight: 500; font-size: .88rem; margin-bottom: 12px; }
.confirm-actions { display: flex; gap: 10px; }

.note { text-align: center; color: var(--text-secondary); font-size: .8rem; margin: 16px auto 0; max-width: 640px; }
.note code { background: var(--card); padding: 1px 6px; border-radius: 6px; }

@media (max-width: 880px) {
  .sidebar { display: none; }
  .dash-grid, .two-col, .cta-row { grid-template-columns: 1fr; }
  .podium { grid-template-columns: 1fr; }
  .topbar .search-pill { min-width: 0; }
}

// ---------- lesson content: 2 lessons per subject, per language, grades 6 and 7 ----------
// Each lesson has a short "summary" (used on cards and for quick review) and a
// longer "content" field with the full lesson text (used in the lesson reader).
var LESSONS = [
  // ===== Grade 7 =====
  { id: 'g7-m-en-1', grade: 7, subject: 'Mathematics', language: 'en', title: 'Simple Interest',
    summary: "Simple interest is calculated only on the principal using Interest = Principal x Rate x Time / 100, and it never compounds on previously earned interest.",
    content: "Simple interest is a way of calculating the extra money you owe or earn on a loan or deposit, based only on the original amount, called the principal. The formula is Interest = Principal x Rate x Time / 100, where Rate is the annual percentage and Time is measured in years. For example, if you deposit Rs.1,000 at a rate of 5% for 2 years, the interest earned is 1000 x 5 x 2 / 100 = Rs.100. Unlike compound interest, simple interest never grows on interest that has already been earned - it stays fixed on the principal for every time period. Banks, moneylenders and savings schemes for children often use simple interest because it is easy to calculate and predict. Knowing this formula helps you check whether a loan offer or savings scheme is fair before you agree to it." },
  { id: 'g7-m-en-2', grade: 7, subject: 'Mathematics', language: 'en', title: 'Fractions - Introduction',
    summary: "A fraction has a numerator and denominator representing parts of a whole, and can be proper, improper, or a mixed number.",
    content: "A fraction represents a part of a whole. It has two parts: the numerator (the top number), which tells us how many parts we have, and the denominator (the bottom number), which tells us how many equal parts the whole has been divided into. For example, in 3/4, the whole has been split into 4 equal parts and we are talking about 3 of them. Fractions can be proper (numerator smaller than denominator, like 3/4), improper (numerator larger, like 5/4), or mixed numbers (a whole number plus a fraction, like 1 1/4). To compare or add fractions, they often need a common denominator - the same bottom number - so the parts being compared are the same size. Fractions appear everywhere in daily life, from sharing food equally to measuring ingredients in a recipe or reading a ruler." },
  { id: 'g7-m-te-1', grade: 7, subject: 'Mathematics', language: 'te', title: 'సామాన్య వడ్డీ',
    summary: "సామాన్య వడ్డీని అసలు మొత్తం మీద మాత్రమే వడ్డీ = అసలు x రేటు x కాలం / 100 సూత్రంతో లెక్కిస్తారు, ఇది వడ్డీ మీద వడ్డీగా పెరగదు.",
    content: "సామాన్య వడ్డీ అనేది అప్పు లేదా డిపాజిట్ మీద వచ్చే అదనపు మొత్తాన్ని లెక్కించే పద్ధతి, ఇది కేవలం అసలు మొత్తం (ప్రిన్సిపల్) మీదనే ఆధారపడి ఉంటుంది. సూత్రం: వడ్డీ = అసలు x రేటు x కాలం / 100, ఇక్కడ రేటు అనేది సంవత్సరానికి శాతం, కాలం సంవత్సరాల్లో ఉంటుంది. ఉదాహరణకు, రూ.1000ను 5% రేటుతో 2 సంవత్సరాలు దాచితే, వడ్డీ = 1000 x 5 x 2 / 100 = రూ.100. కాంపౌండ్ వడ్డీలా కాకుండా, సామాన్య వడ్డీ ఇప్పటికే వచ్చిన వడ్డీ మీద మళ్లీ పెరగదు - ఇది ప్రతి కాలంలో అసలు మొత్తం మీదే స్థిరంగా ఉంటుంది. బ్యాంకులు, పొదుపు పథకాలు లెక్కించడం సులభం కాబట్టి దీన్ని ఎక్కువగా వాడతాయి." },
  { id: 'g7-m-te-2', grade: 7, subject: 'Mathematics', language: 'te', title: 'భిన్నాలు - పరిచయం',
    summary: "భిన్నానికి లవం, హారం ఉంటాయి; ఇది సరైనది, అసరైనది లేదా మిశ్రమ సంఖ్య కావచ్చు, పోల్చడానికి ఒకే హారం అవసరం.",
    content: "భిన్నం అంటే ఒక పూర్తి వస్తువులో ఒక భాగం. దీనికి రెండు భాగాలు ఉంటాయి: లవం (పైన ఉన్న సంఖ్య), ఇది మనకు ఎన్ని భాగాలు ఉన్నాయో చెబుతుంది, మరియు హారం (కింద ఉన్న సంఖ్య), ఇది మొత్తాన్ని ఎన్ని సమాన భాగాలుగా విభజించారో చెబుతుంది. ఉదాహరణకు 3/4లో, మొత్తాన్ని 4 సమాన భాగాలుగా విభజించి, వాటిలో 3 భాగాల గురించి మాట్లాడుతున్నాం. భిన్నాలు సరైనవి (లవం హారం కంటే చిన్నది, 3/4 వంటివి), అసరైనవి (లవం పెద్దది, 5/4 వంటివి), లేదా మిశ్రమ సంఖ్యలు (1 1/4 వంటివి) కావచ్చు. భిన్నాలను పోల్చడానికి లేదా కూడటానికి సాధారణంగా ఒకే హారం అవసరం అవుతుంది." },
  { id: 'g7-m-hi-1', grade: 7, subject: 'Mathematics', language: 'hi', title: 'साधारण ब्याज',
    summary: "साधारण ब्याज मूलधन पर ही ब्याज = मूलधन x दर x समय / 100 सूत्र से निकाला जाता है, यह पहले मिले ब्याज पर दोबारा नहीं बढ़ता।",
    content: "साधारण ब्याज उधार या जमा राशि पर मिलने वाली अतिरिक्त राशि निकालने का एक तरीका है, जो केवल मूल राशि (मूलधन) पर निर्भर करता है। सूत्र है: ब्याज = मूलधन x दर x समय / 100, जहाँ दर सालाना प्रतिशत है और समय वर्षों में मापा जाता है। उदाहरण के लिए, अगर आप रु.1000 को 5% दर पर 2 साल के लिए जमा करते हैं, तो ब्याज = 1000 x 5 x 2 / 100 = रु.100 होगा। चक्रवृद्धि ब्याज के विपरीत, साधारण ब्याज पहले मिले ब्याज पर दोबारा नहीं बढ़ता - यह हर अवधि में मूलधन पर ही स्थिर रहता है। बैंक और बचत योजनाएँ अक्सर इसे इस्तेमाल करती हैं क्योंकि इसकी गणना करना आसान है।" },
  { id: 'g7-m-hi-2', grade: 7, subject: 'Mathematics', language: 'hi', title: 'भिन्न - परिचय',
    summary: "भिन्न में अंश और हर होते हैं; यह सही, अनुचित या मिश्रित संख्या हो सकती है, और तुलना के लिए समान हर चाहिए।",
    content: "भिन्न किसी पूर्ण वस्तु के एक भाग को दर्शाती है। इसके दो भाग होते हैं: अंश (ऊपर की संख्या), जो बताता है कि हमारे पास कितने भाग हैं, और हर (नीचे की संख्या), जो बताता है कि पूरे को कितने बराबर भागों में बाँटा गया है। उदाहरण के लिए 3/4 में, पूरे को 4 बराबर भागों में बाँटा गया है और हम उनमें से 3 भागों की बात कर रहे हैं। भिन्न सही (जैसे 3/4), अनुचित (जैसे 5/4), या मिश्रित संख्या (जैसे 1 1/4) हो सकती है। भिन्नों की तुलना या जोड़ के लिए आमतौर पर एक समान हर की आवश्यकता होती है।" },

  { id: 'g7-s-en-1', grade: 7, subject: 'Science', language: 'en', title: 'States of Matter',
    summary: "Matter exists as solids (fixed shape and volume), liquids (fixed volume, changing shape) and gases (neither fixed), and can change between these states with heat.",
    content: "Matter exists in three common states: solid, liquid, and gas. Solids have a fixed shape and a fixed volume because their particles are packed tightly together and only vibrate in place. Liquids have a fixed volume but take the shape of whatever container they are poured into, since their particles can slide past one another. Gases have neither a fixed shape nor a fixed volume - their particles move fast and spread out to fill any container completely. Matter can change from one state to another through heating or cooling: ice (solid) melts into water (liquid), and water can boil into steam (gas). These changes are called melting, freezing, evaporation and condensation, and they happen without changing what the substance actually is - water is still water in every state." },
  { id: 'g7-s-en-2', grade: 7, subject: 'Science', language: 'en', title: 'The Water Cycle',
    summary: "The water cycle moves water through evaporation, condensation, precipitation and collection, continuously recycling Earth's fresh water supply.",
    content: "Water moves continuously between oceans, rivers, the atmosphere and land in a never-ending journey called the water cycle. The Sun heats water on oceans, lakes and rivers, causing it to evaporate and rise into the air as invisible water vapor. As this vapor rises higher, it cools down and condenses into tiny water droplets, forming clouds. When the droplets in a cloud become too heavy to stay suspended, they fall back to Earth as precipitation - rain, snow, sleet or hail. Some of this water soaks into the ground and becomes groundwater, some flows into rivers and back to the ocean, and some is taken up by plants. This cycle has no true beginning or end, and it is essential for bringing fresh water to every part of the planet." },
  { id: 'g7-s-te-1', grade: 7, subject: 'Science', language: 'te', title: 'పదార్థ స్థితులు',
    summary: "పదార్థం ఘన, ద్రవ, వాయు స్థితుల్లో ఉంటుంది; వేడి లేదా చల్లదనం వల్ల ఒక స్థితి నుండి మరొకదానికి మారుతుంది.",
    content: "పదార్థం మూడు సాధారణ స్థితుల్లో ఉంటుంది: ఘన, ద్రవ, వాయు. ఘన పదార్థాల కణాలు గట్టిగా అమరి ఉండి, తమ స్థానంలోనే కంపిస్తాయి కాబట్టి వాటికి స్థిరమైన ఆకారం, పరిమాణం ఉంటాయి. ద్రవాల కణాలు ఒకదానిపై ఒకటి జారగలవు కాబట్టి ద్రవానికి స్థిరమైన పరిమాణం ఉంటుంది కానీ అది ఉంచిన పాత్ర ఆకారాన్ని తీసుకుంటుంది. వాయు కణాలు వేగంగా కదులుతూ విస్తరిస్తాయి కాబట్టి వాయువుకు ఆకారం, పరిమాణం రెండూ స్థిరంగా ఉండవు. వేడి చేయడం లేదా చల్లార్చడం ద్వారా పదార్థం ఒక స్థితి నుండి మరొక స్థితికి మారుతుంది - మంచు (ఘనం) కరిగి నీరు (ద్రవం) అవుతుంది, నీరు మరిగి ఆవిరి (వాయువు) అవుతుంది." },
  { id: 'g7-s-te-2', grade: 7, subject: 'Science', language: 'te', title: 'నీటి చక్రం',
    summary: "నీటి చక్రం బాష్పీభవనం, సాంద్రీకరణ, అవపాతం ద్వారా భూమిపై నీటిని నిరంతరం తిరిగి ఉపయోగించేలా చేస్తుంది.",
    content: "నీరు సముద్రాలు, నదులు, వాతావరణం, భూమి మధ్య నిరంతరం కదులుతూ ఒక చక్రాన్ని పూర్తి చేస్తుంది, దీన్ని నీటి చక్రం అంటారు. సూర్యుని వేడి వల్ల సముద్రాలు, నదుల్లోని నీరు ఆవిరిగా మారి గాలిలోకి పైకి లేస్తుంది (బాష్పీభవనం). ఈ ఆవిరి పైకి వెళ్లేకొద్దీ చల్లబడి చిన్న నీటి బిందువులుగా మారి మేఘాలను ఏర్పరుస్తుంది (సాంద్రీకరణ). మేఘాల్లోని బిందువులు బరువుగా మారినప్పుడు అవి వర్షం, మంచు వంటి రూపాల్లో భూమి మీద పడతాయి (అవపాతం). ఈ నీటిలో కొంత భూమిలోకి ఇంకి భూగర్భజలంగా మారుతుంది, కొంత నదుల ద్వారా తిరిగి సముద్రానికి చేరుతుంది, కొంత మొక్కలు తీసుకుంటాయి. ఈ చక్రానికి నిజమైన మొదలు లేదా ముగింపు ఉండదు." },
  { id: 'g7-s-hi-1', grade: 7, subject: 'Science', language: 'hi', title: 'पदार्थ की अवस्थाएँ',
    summary: "पदार्थ ठोस, द्रव और गैस अवस्थाओं में रहता है, और गर्मी या ठंडक से एक अवस्था से दूसरी में बदलता है।",
    content: "पदार्थ तीन सामान्य अवस्थाओं में पाया जाता है: ठोस, द्रव और गैस। ठोस के कण कसकर जुड़े होते हैं और अपने स्थान पर ही कंपन करते हैं, इसलिए ठोस का आकार और आयतन दोनों निश्चित होते हैं। द्रव के कण एक-दूसरे पर फिसल सकते हैं, इसलिए द्रव का आयतन निश्चित होता है पर आकार उस पात्र जैसा हो जाता है जिसमें उसे रखा जाता है। गैस के कण तेज़ी से चलते और फैलते हैं, इसलिए गैस का न आकार और न आयतन निश्चित होता है। गर्म करने या ठंडा करने से पदार्थ एक अवस्था से दूसरी अवस्था में बदल जाता है - जैसे बर्फ (ठोस) पिघलकर पानी (द्रव) बनती है, और पानी उबलकर भाप (गैस) बनता है।" },
  { id: 'g7-s-hi-2', grade: 7, subject: 'Science', language: 'hi', title: 'जल चक्र',
    summary: "जल चक्र वाष्पीकरण, संघनन और वर्षण के ज़रिए धरती पर पानी को लगातार पुनः उपयोग में लाता है।",
    content: "पानी समुद्रों, नदियों, वायुमंडल और धरती के बीच लगातार घूमता रहता है, जिसे जल चक्र कहा जाता है। सूर्य की गर्मी से समुद्रों और नदियों का पानी वाष्प बनकर हवा में ऊपर उठता है (वाष्पीकरण)। यह वाष्प ऊपर जाकर ठंडा होता है और छोटी बूंदों में बदलकर बादल बनाता है (संघनन)। जब बादलों की बूंदें भारी हो जाती हैं, तो वे वर्षा, बर्फ जैसे रूपों में धरती पर गिरती हैं (वर्षण)। इस पानी का कुछ हिस्सा ज़मीन में समाकर भूजल बनता है, कुछ नदियों के ज़रिए वापस समुद्र में पहुँचता है, और कुछ पौधे सोख लेते हैं। इस चक्र का न कोई सच्चा आरंभ है, न अंत।" },

  { id: 'g7-e-en-1', grade: 7, subject: 'English', language: 'en', title: 'Parts of Speech',
    summary: "Words are grouped into parts of speech - nouns, verbs, adjectives, adverbs, pronouns, prepositions and conjunctions - based on the job they do in a sentence.",
    content: "Every word in a sentence plays a job, and grammarians group these jobs into categories called parts of speech. A noun names a person, place, animal, or thing, such as teacher, Hyderabad, or pencil. A verb shows an action or a state of being, like run, think, or is. An adjective describes or gives more detail about a noun, such as tall, blue, or happy. An adverb describes a verb, an adjective, or even another adverb, often answering how, when, or where - for example, quickly, yesterday, or there. Other parts of speech include pronouns (he, she, it), which stand in for nouns, prepositions (in, on, under), which show relationships, and conjunctions (and, but, because), which join ideas together. Recognizing these categories helps you understand how sentences are built and makes it easier to fix grammar mistakes." },
  { id: 'g7-e-en-2', grade: 7, subject: 'English', language: 'en', title: 'Tenses in English',
    summary: "Tense shows when an action happens - present, past or future - and each also has continuous and perfect forms for extra precision.",
    content: "English verbs change form to show when an action happens - this is called tense. The present tense describes something happening now or a habit, as in I walk to school every day. The past tense describes something that already happened, as in I walked to school yesterday. The future tense describes something that has not happened yet, as in I will walk to school tomorrow. Each of these can also have continuous forms (I am walking, I was walking, I will be walking) to show an action in progress, and perfect forms (I have walked, I had walked, I will have walked) to show an action that is completed relative to another point in time. Choosing the right tense helps the listener or reader understand exactly when something took place, which makes your speaking and writing much clearer." },
  { id: 'g7-e-te-1', grade: 7, subject: 'English', language: 'te', title: 'పద భాగాలు (Parts of Speech)',
    summary: "పదాలను వాటి పని ఆధారంగా noun, verb, adjective, adverb, pronoun, preposition, conjunction అనే పద భాగాలుగా విభజిస్తారు.",
    content: "వాక్యంలో ప్రతి పదం ఒక పని చేస్తుంది, వ్యాకరణవేత్తలు వీటిని పద భాగాలు (parts of speech) అనే వర్గాలుగా విభజిస్తారు. Noun ఒక వ్యక్తి, స్థలం, జంతువు లేదా వస్తువును సూచిస్తుంది, ఉదాహరణకు teacher, Hyderabad, pencil. Verb ఒక చర్య లేదా స్థితిని తెలియజేస్తుంది, run, think, is వంటివి. Adjective ఒక nounను వర్ణిస్తుంది, tall, blue, happy వంటివి. Adverb ఒక verb, adjective లేదా మరో adverbను వర్ణిస్తుంది, ఎలా, ఎప్పుడు, ఎక్కడ అనే ప్రశ్నలకు సమాధానమిస్తూ - quickly, yesterday, there వంటివి. Pronoun (he, she, it) nounకు బదులుగా వస్తుంది, preposition (in, on, under) సంబంధాన్ని చూపుతుంది, conjunction (and, but, because) ఆలోచనలను కలుపుతుంది." },
  { id: 'g7-e-te-2', grade: 7, subject: 'English', language: 'te', title: 'ఆంగ్లంలో కాలాలు (Tenses)',
    summary: "Tense చర్య ఎప్పుడు జరిగిందో చూపుతుంది - present, past, future - వీటికి continuous, perfect రూపాలు కూడా ఉంటాయి.",
    content: "ఆంగ్ల క్రియలు చర్య ఎప్పుడు జరిగిందో చూపించడానికి రూపం మారుస్తాయి - దీన్ని tense అంటారు. Present tense ఇప్పుడు జరుగుతున్నది లేదా అలవాటును తెలియజేస్తుంది, I walk to school every day వంటిది. Past tense ఇప్పటికే జరిగిన దాన్ని తెలియజేస్తుంది, I walked to school yesterday. Future tense ఇంకా జరగనిదాన్ని తెలియజేస్తుంది, I will walk to school tomorrow. వీటికి continuous రూపాలు (I am walking) చర్య జరుగుతుండటాన్ని, perfect రూపాలు (I have walked) ఒక పని పూర్తయిందని చూపుతాయి. సరైన tense వాడటం వినేవారికి, చదివేవారికి పని ఎప్పుడు జరిగిందో స్పష్టంగా అర్థమయ్యేలా చేస్తుంది." },
  { id: 'g7-e-hi-1', grade: 7, subject: 'English', language: 'hi', title: 'शब्द भेद (Parts of Speech)',
    summary: "शब्दों को उनके काम के आधार पर noun, verb, adjective, adverb, pronoun, preposition और conjunction जैसे शब्द भेदों में बाँटा जाता है।",
    content: "वाक्य में हर शब्द एक काम करता है, और व्याकरणविद इन्हें शब्द भेद (parts of speech) नामक श्रेणियों में बाँटते हैं। Noun किसी व्यक्ति, स्थान, जानवर या वस्तु का नाम बताता है, जैसे teacher, Hyderabad, pencil। Verb किसी क्रिया या स्थिति को दर्शाता है, जैसे run, think, is। Adjective किसी noun की विशेषता बताता है, जैसे tall, blue, happy। Adverb किसी verb, adjective या दूसरे adverb की विशेषता बताता है, अक्सर कैसे, कब, कहाँ का उत्तर देते हुए - जैसे quickly, yesterday, there। Pronoun (he, she, it) noun की जगह आता है, preposition (in, on, under) संबंध दिखाता है, और conjunction (and, but, because) विचारों को जोड़ता है।" },
  { id: 'g7-e-hi-2', grade: 7, subject: 'English', language: 'hi', title: 'अंग्रेज़ी में काल (Tenses)',
    summary: "Tense दिखाता है कि काम कब हुआ - present, past या future - और इनके continuous व perfect रूप भी होते हैं।",
    content: "अंग्रेज़ी की क्रियाएँ यह दिखाने के लिए रूप बदलती हैं कि काम कब हुआ - इसे tense कहते हैं। Present tense अभी हो रहे काम या आदत को बताता है, जैसे I walk to school every day। Past tense पहले हो चुके काम को बताता है, जैसे I walked to school yesterday। Future tense अभी न हुए काम को बताता है, जैसे I will walk to school tomorrow। इनके continuous रूप (I am walking) काम के चलते रहने को, और perfect रूप (I have walked) काम के पूरा होने को दिखाते हैं। सही tense चुनने से सुनने और पढ़ने वाले को साफ़ पता चलता है कि काम कब हुआ।" },

  { id: 'g7-ss-en-1', grade: 7, subject: 'Social Studies', language: 'en', title: 'Rivers of India',
    summary: "Major rivers like the Ganga, Godavari, Krishna and Kaveri support farming, drinking water, transport and power across India.",
    content: "India is home to several major river systems that have shaped its history, farming and daily life for thousands of years. The Ganga, considered sacred by millions, flows from the Himalayas through the northern plains and supports one of the most densely populated river basins in the world. The Godavari, sometimes called the Ganga of the South, and the Krishna both flow across the Deccan Plateau, irrigating large areas of Andhra Pradesh and Telangana. The Kaveri flows through Karnataka and Tamil Nadu and has long been central to farming and, at times, disputes between states over water sharing. Beyond irrigation, these rivers provide drinking water, support fishing communities, generate hydroelectric power, and serve as transport routes. Because rainfall is seasonal in India, rivers and the dams built along them are vital for storing water through the dry months." },
  { id: 'g7-ss-en-2', grade: 7, subject: 'Social Studies', language: 'en', title: 'Local Self-Government',
    summary: "The Gram Panchayat is an elected local body that manages roads, water, sanitation and schools as part of India's three-tier Panchayati Raj system.",
    content: "In India, villages are governed at the local level by a system called the Gram Panchayat, which is part of a wider structure known as the Panchayati Raj. Members of the Gram Panchayat, including the Sarpanch (village head), are elected directly by the villagers, usually every five years. This local body is responsible for practical, everyday needs of the community - building and repairing roads, ensuring a clean water supply, managing sanitation and waste, running local schools and health centers, and maintaining street lighting. Above the Gram Panchayat, a Panchayat Samiti works at the block level, and a Zila Parishad works at the district level, together forming a three-tier system. This structure brings decision-making closer to the people it affects, allowing villagers to raise concerns directly with representatives who live in their own community." },
  { id: 'g7-ss-te-1', grade: 7, subject: 'Social Studies', language: 'te', title: 'భారతదేశ నదులు',
    summary: "గంగా, గోదావరి, కృష్ణా, కావేరి వంటి నదులు వ్యవసాయం, తాగునీరు, రవాణా, జలవిద్యుత్తుకు తోడ్పడతాయి.",
    content: "భారతదేశంలో అనేక ప్రధాన నదీ వ్యవస్థలు వేల సంవత్సరాలుగా దేశ చరిత్ర, వ్యవసాయం, రోజువారీ జీవితాన్ని రూపొందించాయి. లక్షలాది మంది పవిత్రంగా భావించే గంగా నది హిమాలయాల నుండి ఉత్తర మైదానాల గుండా ప్రవహిస్తుంది. దక్షిణ గంగగా పిలువబడే గోదావరి, కృష్ణా నదులు దక్కన్ పీఠభూమి మీదుగా ప్రవహిస్తూ ఆంధ్రప్రదేశ్, తెలంగాణలోని పెద్ద ప్రాంతాలకు నీటిపారుదల అందిస్తాయి. కావేరి నది కర్ణాటక, తమిళనాడుల మీదుగా ప్రవహిస్తుంది, వ్యవసాయానికి కీలకం అయినప్పటికీ కొన్నిసార్లు నీటి పంపిణీపై రాష్ట్రాల మధ్య వివాదాలకు కారణమవుతుంది. ఈ నదులు తాగునీరు, చేపల పెంపకం, జలవిద్యుత్, రవాణాకు కూడా ఉపయోగపడతాయి." },
  { id: 'g7-ss-te-2', grade: 7, subject: 'Social Studies', language: 'te', title: 'స్థానిక స్వపరిపాలన',
    summary: "గ్రామ పంచాయతీ ఎన్నికైన స్థానిక సంస్థ, రోడ్లు, నీరు, పారిశుద్ధ్యం, పాఠశాలలను చూసుకుంటూ మూడంచెల పంచాయతీ రాజ్‌లో భాగంగా పనిచేస్తుంది.",
    content: "భారతదేశంలో గ్రామాలను స్థానిక స్థాయిలో గ్రామ పంచాయతీ పరిపాలిస్తుంది, ఇది పంచాయతీ రాజ్ అనే విస్తృత వ్యవస్థలో భాగం. గ్రామ పంచాయతీ సభ్యులను, సర్పంచ్‌తో సహా, గ్రామస్తులు నేరుగా ఎన్నుకుంటారు, సాధారణంగా ప్రతి ఐదేళ్లకు ఒకసారి. ఈ స్థానిక సంస్థ రోడ్ల నిర్మాణం, మరమ్మతులు, స్వచ్ఛమైన నీటి సరఫరా, పారిశుద్ధ్యం, స్థానిక పాఠశాలలు, ఆరోగ్య కేంద్రాల నిర్వహణ వంటి రోజువారీ అవసరాలను చూసుకుంటుంది. గ్రామ పంచాయతీ పైన బ్లాక్ స్థాయిలో పంచాయతీ సమితి, జిల్లా స్థాయిలో జిల్లా పరిషత్ పనిచేస్తాయి, ఇవి కలిసి మూడంచెల వ్యవస్థను ఏర్పరుస్తాయి. ఈ నిర్మాణం నిర్ణయాలు తీసుకోవడాన్ని ప్రజలకు దగ్గరగా తీసుకువస్తుంది." },
  { id: 'g7-ss-hi-1', grade: 7, subject: 'Social Studies', language: 'hi', title: 'भारत की नदियाँ',
    summary: "गंगा, गोदावरी, कृष्णा और कावेरी जैसी नदियाँ खेती, पीने के पानी, परिवहन और जलविद्युत में सहायक हैं।",
    content: "भारत में कई प्रमुख नदी प्रणालियों ने हज़ारों वर्षों से देश के इतिहास, खेती और रोज़मर्रा के जीवन को आकार दिया है। लाखों लोगों द्वारा पवित्र मानी जाने वाली गंगा नदी हिमालय से निकलकर उत्तरी मैदानों से होकर बहती है। दक्षिण की गंगा कही जाने वाली गोदावरी और कृष्णा नदियाँ दक्कन के पठार से होकर बहती हैं और आंध्र प्रदेश व तेलंगाना के बड़े हिस्सों की सिंचाई करती हैं। कावेरी नदी कर्नाटक और तमिलनाडु से होकर बहती है, खेती के लिए अहम है पर कभी-कभी राज्यों के बीच जल-बँटवारे को लेकर विवाद का कारण भी बनती है। ये नदियाँ पीने का पानी, मछली पालन, जलविद्युत और परिवहन में भी मदद करती हैं।" },
  { id: 'g7-ss-hi-2', grade: 7, subject: 'Social Studies', language: 'hi', title: 'स्थानीय स्वशासन',
    summary: "ग्राम पंचायत एक निर्वाचित स्थानीय संस्था है जो सड़क, पानी, स्वच्छता और स्कूलों का ध्यान रखते हुए त्रि-स्तरीय पंचायती राज का हिस्सा है।",
    content: "भारत में गाँवों का प्रशासन स्थानीय स्तर पर ग्राम पंचायत करती है, जो पंचायती राज नामक व्यापक व्यवस्था का हिस्सा है। ग्राम पंचायत के सदस्यों को, सरपंच सहित, गाँव वाले सीधे चुनते हैं, आमतौर पर हर पाँच साल में एक बार। यह स्थानीय संस्था सड़कों के निर्माण-मरम्मत, स्वच्छ जल आपूर्ति, स्वच्छता, स्थानीय स्कूलों और स्वास्थ्य केंद्रों के प्रबंधन जैसी रोज़मर्रा की ज़रूरतों का ध्यान रखती है। ग्राम पंचायत के ऊपर ब्लॉक स्तर पर पंचायत समिति और ज़िला स्तर पर ज़िला परिषद काम करती है, जो मिलकर तीन-स्तरीय व्यवस्था बनाती हैं। यह ढाँचा निर्णय लेने की प्रक्रिया को लोगों के करीब लाता है।" },

  { id: 'g7-tel-en-1', grade: 7, subject: 'Telugu', language: 'en', title: 'The Telugu Alphabet',
    summary: "Telugu script has 16 vowels and 36 consonants that combine into syllables, and is highly phonetic, so learning the symbols lets you read new words correctly.",
    content: "Telugu has its own script, one of the oldest and most systematic writing systems in India, made up of 16 vowels (achulu) and 36 consonants (hallulu). The vowels include short forms like a, i, u and their long counterparts aa, ee, oo, and each vowel changes the sound of a consonant when attached to it as a small mark called a vowel sign, or gunintam. Consonants alone represent a sound followed by an inherent a, and combine with vowel signs to form full syllables - the basic building block of Telugu writing. Because the script is largely phonetic, once you learn the shapes of the vowels, consonants, and their combined forms, you can read almost any Telugu word correctly, even one you have never seen before, since each symbol reliably represents the same sound." },
  { id: 'g7-tel-en-2', grade: 7, subject: 'Telugu', language: 'en', title: 'Simple Telugu Greetings',
    summary: "Namaskaram (hello), Meeru bagunnara (how are you), Dhanyavadalu (thank you) and Vastanu (goodbye) are essential everyday Telugu greetings to practice often.",
    content: "Learning a handful of everyday greetings is the first and most useful step toward speaking a new language. In Telugu, Namaskaram is used as a respectful way to say hello, and can be used with elders, teachers or strangers at any time of day. To ask someone how they are doing, you would say Meeru bagunnara, and a common reply is Baagunnanu, meaning I am fine. To thank someone, you say Dhanyavadalu, and a simple way to say goodbye is Vastanu, which literally means I will come again. These short phrases are used constantly in daily conversation, at home, in markets and in school, so practicing them out loud, and using them whenever you get the chance, is one of the fastest ways to become comfortable speaking Telugu." },
  { id: 'g7-tel-te-1', grade: 7, subject: 'Telugu', language: 'te', title: 'తెలుగు వర్ణమాల',
    summary: "తెలుగు లిపిలో 16 అచ్చులు, 36 హల్లులు ఉన్నాయి, ఇవి కలిసి అక్షరాలను ఏర్పరుస్తాయి; ఇది ధ్వన్యాత్మక లిపి కావడంతో కొత్త పదాలు కూడా చదవగలుగుతారు.",
    content: "తెలుగుకు స్వంత లిపి ఉంది, ఇది భారతదేశంలోని అత్యంత వ్యవస్థీకృత లిపుల్లో ఒకటి, 16 అచ్చులు (achulu), 36 హల్లులు (hallulu) కలిగి ఉంటుంది. అచ్చుల్లో హ్రస్వ రూపాలు అ, ఇ, ఉ, వాటి దీర్ఘ రూపాలు ఆ, ఈ, ఊ ఉంటాయి. ప్రతి అచ్చు ఒక హల్లుతో కలిసినప్పుడు ఆ హల్లు ధ్వనిని గుణింతం అనే చిన్న గుర్తు రూపంలో మారుస్తుంది. హల్లులు ఒంటరిగా ఉన్నప్పుడు తమలో ఇమిడి ఉన్న అ ధ్వనితో పలుకుతాయి, అచ్చు గుర్తులతో కలిసి పూర్తి అక్షరాలను ఏర్పరుస్తాయి - ఇది తెలుగు రాత యొక్క మౌలిక యూనిట్. ఈ లిపి ఎక్కువగా ధ్వన్యాత్మకమైనది కాబట్టి, అక్షరాల ఆకారాలు నేర్చుకుంటే కొత్త పదాలను కూడా సరిగ్గా చదవగలరు." },
  { id: 'g7-tel-te-2', grade: 7, subject: 'Telugu', language: 'te', title: 'సాధారణ తెలుగు పలకరింపులు',
    summary: "నమస్కారం (హలో), మీరు బాగున్నారా (ఎలా ఉన్నారు), ధన్యవాదాలు (కృతజ్ఞతలు), వస్తాను (వీడ్కోలు) రోజువారీ తెలుగు పలకరింపులు.",
    content: "కొత్త భాష మాట్లాడటానికి రోజువారీ పలకరింపులు కొన్ని నేర్చుకోవడం మొదటి, అత్యంత ఉపయోగకరమైన అడుగు. తెలుగులో నమస్కారం అనేది గౌరవప్రదమైన హలో పలకరింపు, పెద్దలతో, గురువులతో, అపరిచితులతో ఎప్పుడైనా వాడొచ్చు. ఎవరైనా ఎలా ఉన్నారో అడగడానికి మీరు బాగున్నారా అని అడుగుతారు, సాధారణ సమాధానం బాగున్నాను అంటే నేను బాగున్నాను. కృతజ్ఞత తెలపడానికి ధన్యవాదాలు అంటారు, వీడ్కోలు చెప్పడానికి వస్తాను అనేది సాధారణంగా వాడతారు, దీని అర్థం మళ్లీ వస్తాను అని. ఈ చిన్న పదాలు ఇంట్లో, మార్కెట్లో, స్కూల్లో నిత్యం వాడుకలో ఉంటాయి, వీటిని బిగ్గరగా అభ్యాసం చేయడం తెలుగు మాట్లాడటంలో మెరుగుపడటానికి వేగవంతమైన మార్గం." },
  { id: 'g7-tel-hi-1', grade: 7, subject: 'Telugu', language: 'hi', title: 'तेलुगु वर्णमाला',
    summary: "तेलुगु लिपि में 16 स्वर और 36 व्यंजन होते हैं जो मिलकर अक्षर बनाते हैं; यह ध्वन्यात्मक लिपि है, इसलिए नए शब्द भी सही पढ़े जा सकते हैं।",
    content: "तेलुगु की अपनी लिपि है, जो भारत की सबसे व्यवस्थित लिपियों में से एक मानी जाती है, इसमें 16 स्वर (अचुलु) और 36 व्यंजन (हल्लुलु) होते हैं। स्वरों में ह्रस्व रूप अ, इ, उ और उनके दीर्घ रूप आ, ई, ऊ शामिल हैं। जब कोई स्वर किसी व्यंजन से जुड़ता है, तो वह व्यंजन की ध्वनि को गुणिंतम नामक एक छोटे चिह्न के रूप में बदल देता है। अकेले व्यंजन अपने भीतर छिपी अ ध्वनि के साथ बोले जाते हैं, और स्वर चिह्नों के साथ मिलकर पूरे अक्षर बनाते हैं - जो तेलुगु लेखन की मूल इकाई है। यह लिपि काफ़ी हद तक ध्वन्यात्मक है, इसलिए अक्षरों के आकार सीखने के बाद नए शब्द भी सही ढंग से पढ़े जा सकते हैं।" },
  { id: 'g7-tel-hi-2', grade: 7, subject: 'Telugu', language: 'hi', title: 'आम तेलुगु अभिवादन',
    summary: "नमस्कारम् (नमस्ते), मीरु बागुन्नारा (कैसे हैं), धन्यवादालु (धन्यवाद) और वस्तानु (विदा) रोज़मर्रा के ज़रूरी तेलुगु अभिवादन हैं।",
    content: "किसी नई भाषा को बोलने के लिए रोज़मर्रा के अभिवादन सीखना सबसे पहला और सबसे उपयोगी कदम है। तेलुगु में नमस्कारम् एक सम्मानजनक अभिवादन है, जिसे बड़ों, शिक्षकों या अजनबियों के साथ किसी भी समय इस्तेमाल किया जा सकता है। किसी से हालचाल पूछने के लिए मीरु बागुन्नारा कहा जाता है, और आम जवाब है बागुन्नानु यानी मैं ठीक हूँ। धन्यवाद कहने के लिए धन्यवादालु कहते हैं, और विदा लेने के लिए आमतौर पर वस्तानु कहा जाता है, जिसका शाब्दिक अर्थ है मैं फिर आऊँगा। ये छोटे वाक्यांश घर, बाज़ार और स्कूल में रोज़ इस्तेमाल होते हैं, इन्हें ज़ोर से बोलकर अभ्यास करना तेलुगु में सहज होने का सबसे तेज़ तरीका है।" },

  // ===== Grade 6 =====
  { id: 'g6-m-en-1', grade: 6, subject: 'Mathematics', language: 'en', title: 'Whole Numbers and Place Value',
    summary: "Each digit's value depends on its position (ones, tens, hundreds, thousands), and understanding place value helps you read, write and compare large numbers.",
    content: "Every digit in a number has a value based on where it sits - this is called its place value. In the number 4,528, the 4 is in the thousands place (worth 4000), the 5 is in the hundreds place (worth 500), the 2 is in the tens place (worth 20), and the 8 is in the ones place (worth 8). Adding these together - 4000 + 500 + 20 + 8 - gives back the original number, which is called its expanded form. Understanding place value helps you read large numbers correctly out loud, write them without missing digits, and compare two numbers by looking at their leftmost, largest-value digits first. It also explains why moving a digit one place to the left makes it worth ten times as much, which is the foundation for later topics like decimals and multiplication by powers of ten." },
  { id: 'g6-m-en-2', grade: 6, subject: 'Mathematics', language: 'en', title: 'Understanding Fractions',
    summary: "A fraction has a numerator and denominator showing parts of a whole, and different-looking fractions like 1/2 and 2/4 can be equivalent.",
    content: "A fraction shows a part of a whole, written with a numerator (the top number) and a denominator (the bottom number). The denominator tells you how many equal parts the whole has been split into, and the numerator tells you how many of those parts you are considering - for example, in 3/4, the whole is split into 4 equal parts and we mean 3 of them. Fractions can describe things like half a chapati (1/2), a quarter of an hour (1/4), or three out of five marbles (3/5). Two fractions are equivalent if they represent the same amount even though the numbers look different, such as 1/2 and 2/4. To compare fractions easily, it often helps to picture them as slices of the same-sized whole, like a pizza or a chocolate bar cut into equal pieces." },
  { id: 'g6-m-te-1', grade: 6, subject: 'Mathematics', language: 'te', title: 'పూర్ణ సంఖ్యలు మరియు స్థాన విలువ',
    summary: "ప్రతి అంకె విలువ దాని స్థానం (ఒకట్లు, పదులు, వందలు, వేలు) మీద ఆధారపడి ఉంటుంది, ఇది పెద్ద సంఖ్యలను చదవడం, పోల్చడంలో సహాయపడుతుంది.",
    content: "ఒక సంఖ్యలో ప్రతి అంకె దాని స్థానం ఆధారంగా ఒక విలువను కలిగి ఉంటుంది, దీన్నే స్థాన విలువ అంటారు. 4,528 అనే సంఖ్యలో, 4 అనేది వేల స్థానంలో ఉంది (విలువ 4000), 5 వందల స్థానంలో ఉంది (విలువ 500), 2 పదుల స్థానంలో ఉంది (విలువ 20), 8 ఒకట్ల స్థానంలో ఉంది (విలువ 8). వీటిని కలిపితే - 4000 + 500 + 20 + 8 - మళ్లీ అసలు సంఖ్య వస్తుంది, దీన్ని విస్తరించిన రూపం అంటారు. స్థాన విలువ అర్థం చేసుకోవడం పెద్ద సంఖ్యలను సరిగ్గా చదవడానికి, రాయడానికి, ఎడమ వైపు అతిపెద్ద విలువ అంకెలను ముందుగా చూసి రెండు సంఖ్యలను పోల్చడానికి సహాయపడుతుంది." },
  { id: 'g6-m-te-2', grade: 6, subject: 'Mathematics', language: 'te', title: 'భిన్నాలను అర్థం చేసుకోవడం',
    summary: "భిన్నానికి లవం, హారం ఉంటాయి; 1/2, 2/4 వంటి వేరుగా కనిపించే భిన్నాలు కూడా సమానం కావచ్చు.",
    content: "భిన్నం అంటే ఒక మొత్తంలో ఒక భాగం, దీన్ని లవం (పైన ఉన్న సంఖ్య), హారం (కింద ఉన్న సంఖ్య)తో రాస్తారు. హారం మొత్తాన్ని ఎన్ని సమాన భాగాలుగా విభజించారో చెబుతుంది, లవం వాటిలో ఎన్ని భాగాలను మనం పరిగణిస్తున్నామో చెబుతుంది - ఉదాహరణకు 3/4లో, మొత్తాన్ని 4 సమాన భాగాలుగా విభజించి, వాటిలో 3 భాగాల గురించి మాట్లాడుతున్నాం. భిన్నాలు సగం చపాతీ (1/2), పావు గంట (1/4), లేదా ఐదింటిలో మూడు గోళీలు (3/5) వంటి వాటిని తెలియజేయగలవు. రెండు భిన్నాలు వేర్వేరుగా కనిపించినా ఒకే మొత్తాన్ని సూచిస్తే వాటిని సమాన భిన్నాలు అంటారు, ఉదాహరణకు 1/2, 2/4." },
  { id: 'g6-m-hi-1', grade: 6, subject: 'Mathematics', language: 'hi', title: 'पूर्ण संख्याएँ और स्थानीय मान',
    summary: "हर अंक का मान उसकी स्थिति (इकाई, दहाई, सैकड़ा, हज़ार) पर निर्भर करता है, जिससे बड़ी संख्याएँ पढ़ना और तुलना करना आसान होता है।",
    content: "किसी संख्या में हर अंक का एक मान होता है जो उसकी स्थिति पर निर्भर करता है, इसे स्थानीय मान कहते हैं। संख्या 4,528 में, 4 हज़ार के स्थान पर है (मान 4000), 5 सैकड़ा के स्थान पर है (मान 500), 2 दहाई के स्थान पर है (मान 20), और 8 इकाई के स्थान पर है (मान 8)। इन्हें जोड़ने पर - 4000 + 500 + 20 + 8 - मूल संख्या वापस मिलती है, जिसे विस्तारित रूप कहते हैं। स्थानीय मान समझने से बड़ी संख्याओं को सही ढंग से पढ़ना, लिखना, और बाईं ओर के सबसे बड़े मान के अंकों को पहले देखकर दो संख्याओं की तुलना करना आसान हो जाता है।" },
  { id: 'g6-m-hi-2', grade: 6, subject: 'Mathematics', language: 'hi', title: 'भिन्न को समझना',
    summary: "भिन्न में अंश और हर होते हैं; 1/2 और 2/4 जैसी अलग दिखने वाली भिन्नें भी समतुल्य हो सकती हैं।",
    content: "भिन्न किसी पूरी वस्तु के एक भाग को दर्शाती है, इसे अंश (ऊपर की संख्या) और हर (नीचे की संख्या) से लिखा जाता है। हर बताता है कि पूरे को कितने बराबर भागों में बाँटा गया है, और अंश बताता है कि हम उनमें से कितने भागों की बात कर रहे हैं - जैसे 3/4 में, पूरे को 4 बराबर भागों में बाँटकर उनमें से 3 भागों की बात हो रही है। भिन्न आधी रोटी (1/2), पंद्रह मिनट यानी चौथाई घंटा (1/4), या पाँच में से तीन कंचे (3/5) जैसी चीज़ों को दर्शा सकती है। दो भिन्न भले अलग दिखें, अगर वे एक ही मात्रा दर्शाती हैं तो उन्हें समतुल्य भिन्न कहा जाता है, जैसे 1/2 और 2/4।" },

  { id: 'g6-s-en-1', grade: 6, subject: 'Science', language: 'en', title: 'Living and Non-Living Things',
    summary: "Living things grow, breathe, need food, reproduce and respond to surroundings, while non-living things like stones or chairs do none of these.",
    content: "All things around us can be grouped into living and non-living things. Living things share several key characteristics: they grow in size over time, they breathe or respire to release energy, they need food or nutrients to survive, they can reproduce to create new living things, and they respond to changes in their surroundings, such as a plant bending toward sunlight. Animals, plants, and even tiny microorganisms are all living things. Non-living things, such as stones, chairs, water, and mountains, do not grow on their own, do not need food, and cannot reproduce - even though some non-living things, like a candle flame, can appear to move or change. Some objects, like a dried leaf that has fallen from a tree, are tricky to classify because they were once part of a living thing but are no longer alive themselves." },
  { id: 'g6-s-en-2', grade: 6, subject: 'Science', language: 'en', title: 'Our Solar System',
    summary: "The solar system has the Sun and eight planets orbiting it; Earth alone has the right air, water and temperature to support life.",
    content: "Our solar system is made up of the Sun at its center, along with eight planets, their moons, and countless smaller objects like asteroids and comets, all held in orbit by the Sun's gravity. In order from the Sun, the planets are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune. The first four are smaller, rocky planets, while the outer four are much larger planets made mostly of gas. Earth is the third planet from the Sun and, as far as we know, the only planet with life, because it has the right combination of breathable air, liquid water, and a temperature that is neither too hot nor too cold. Each planet takes a different amount of time to orbit the Sun once, which is why a year on Mercury is much shorter than a year on Earth, and a year on Neptune is far longer." },
  { id: 'g6-s-te-1', grade: 6, subject: 'Science', language: 'te', title: 'జీవులు మరియు నిర్జీవులు',
    summary: "జీవులు పెరుగుతాయి, శ్వాసిస్తాయి, ఆహారం తీసుకుంటాయి, సంతానోత్పత్తి చేస్తాయి, స్పందిస్తాయి; నిర్జీవులు వీటిలో దేనినీ చేయవు.",
    content: "మన చుట్టూ ఉన్న అన్ని వస్తువులను జీవులు, నిర్జీవులు అని రెండు వర్గాలుగా విభజించవచ్చు. జీవులు కొన్ని ముఖ్య లక్షణాలను పంచుకుంటాయి: అవి కాలక్రమేణా పరిమాణంలో పెరుగుతాయి, శక్తి కోసం శ్వాసిస్తాయి, జీవించడానికి ఆహారం అవసరం, కొత్త జీవులను సృష్టించడానికి సంతానోత్పత్తి చేస్తాయి, పరిసరాల్లో మార్పులకు స్పందిస్తాయి - ఉదాహరణకు మొక్క సూర్యకాంతి వైపు వంగడం. జంతువులు, మొక్కలు, చిన్న సూక్ష్మజీవులు కూడా జీవులే. రాళ్లు, కుర్చీలు, నీరు, పర్వతాల వంటి నిర్జీవులు తమంతట తాము పెరగవు, ఆహారం అవసరం లేదు, సంతానోత్పత్తి చేయలేవు." },
  { id: 'g6-s-te-2', grade: 6, subject: 'Science', language: 'te', title: 'మన సౌర వ్యవస్థ',
    summary: "సౌర వ్యవస్థలో సూర్యుడు, ఎనిమిది గ్రహాలు ఉన్నాయి; తగిన గాలి, నీరు, ఉష్ణోగ్రత ఉన్న భూమి మాత్రమే జీవానికి అనుకూలం.",
    content: "మన సౌర వ్యవస్థ మధ్యలో సూర్యుడు ఉంటాడు, దాని చుట్టూ ఎనిమిది గ్రహాలు, వాటి ఉపగ్రహాలు, గ్రహశకలాలు, తోకచుక్కల వంటి లెక్కలేనన్ని చిన్న వస్తువులు సూర్యుని గురుత్వాకర్షణ వల్ల కక్ష్యలో తిరుగుతాయి. సూర్యుడి నుండి క్రమంలో బుధుడు, శుక్రుడు, భూమి, అంగారకుడు, గురుడు, శని, యురేనస్, నెప్ట్యూన్ గ్రహాలు ఉన్నాయి. మొదటి నాలుగు చిన్న, రాతి గ్రహాలు కాగా, చివరి నాలుగు ఎక్కువగా వాయువుతో కూడిన పెద్ద గ్రహాలు. భూమి సూర్యుని నుండి మూడో గ్రహం, మనకు తెలిసినంతవరకు జీవం ఉన్న ఏకైక గ్రహం, ఎందుకంటే దీనికి తగిన గాలి, ద్రవ నీరు, తగిన ఉష్ణోగ్రత ఉన్నాయి." },
  { id: 'g6-s-hi-1', grade: 6, subject: 'Science', language: 'hi', title: 'सजीव और निर्जीव वस्तुएँ',
    summary: "सजीव वस्तुएँ बढ़ती हैं, साँस लेती हैं, भोजन लेती हैं, प्रजनन करती हैं और प्रतिक्रिया देती हैं; निर्जीव वस्तुएँ ऐसा कुछ नहीं करतीं।",
    content: "हमारे चारों ओर की सभी चीज़ों को सजीव और निर्जीव, दो समूहों में बाँटा जा सकता है। सजीव वस्तुएँ कुछ खास गुण साझा करती हैं: वे समय के साथ आकार में बढ़ती हैं, ऊर्जा पाने के लिए साँस लेती हैं, जीवित रहने के लिए भोजन की ज़रूरत होती है, नए जीव बनाने के लिए प्रजनन करती हैं, और अपने परिवेश में बदलाव पर प्रतिक्रिया देती हैं - जैसे कोई पौधा धूप की ओर झुकना। जानवर, पौधे और छोटे सूक्ष्मजीव भी सजीव हैं। पत्थर, कुर्सी, पानी और पहाड़ जैसी निर्जीव वस्तुएँ खुद से नहीं बढ़तीं, उन्हें भोजन की ज़रूरत नहीं होती, और वे प्रजनन नहीं कर सकतीं।" },
  { id: 'g6-s-hi-2', grade: 6, subject: 'Science', language: 'hi', title: 'हमारा सौरमंडल',
    summary: "सौरमंडल में सूर्य और आठ ग्रह हैं; उपयुक्त हवा, पानी और तापमान के कारण पृथ्वी ही जीवन के लिए उपयुक्त है।",
    content: "हमारे सौरमंडल के केंद्र में सूर्य है, जिसके चारों ओर आठ ग्रह, उनके चंद्रमा, और क्षुद्रग्रह व धूमकेतु जैसी अनगिनत छोटी वस्तुएँ सूर्य के गुरुत्वाकर्षण के कारण परिक्रमा करती हैं। सूर्य से क्रम में बुध, शुक्र, पृथ्वी, मंगल, बृहस्पति, शनि, अरुण और वरुण ग्रह हैं। पहले चार छोटे, चट्टानी ग्रह हैं, जबकि आखिरी चार मुख्यतः गैस से बने बड़े ग्रह हैं। पृथ्वी सूर्य से तीसरा ग्रह है और जहाँ तक हमें पता है, जीवन वाला एकमात्र ग्रह है, क्योंकि यहाँ उपयुक्त हवा, तरल पानी और सही तापमान मौजूद है।" },

  { id: 'g6-e-en-1', grade: 6, subject: 'English', language: 'en', title: 'Nouns and Pronouns',
    summary: "Nouns name people, places, animals or things, while pronouns like he, she, and it replace nouns to avoid repeating them.",
    content: "A noun names a person, place, animal, or thing - words like teacher, village, dog, or book are all nouns. There are different kinds of nouns: common nouns name general things (boy, city), proper nouns name specific things and start with a capital letter (Ravi, Hyderabad), and collective nouns name a group (a herd of cattle, a team of players). A pronoun is a word used in place of a noun so that we do not have to repeat it again and again - words like he, she, it, they, and we are all pronouns. For example, instead of saying Priya went to Priya's school because Priya forgot Priya's bag, we say Priya went to her school because she forgot her bag, which sounds much more natural. Using pronouns correctly makes your sentences shorter and easier to read." },
  { id: 'g6-e-en-2', grade: 6, subject: 'English', language: 'en', title: 'Simple Sentences',
    summary: "A simple sentence has one subject and one verb expressing a single complete idea, unlike compound sentences which join two ideas together.",
    content: "A simple sentence contains one subject and one verb, and expresses exactly one complete idea - for example, The sun rises in the east. Here, the sun is the subject, who or what the sentence is about, and rises is the verb, the action. A simple sentence can also include extra details, like objects or descriptive words, as long as it still has just one main subject-verb pair: The bright sun rises slowly in the east every morning. Simple sentences are different from compound sentences, which join two complete ideas together using words like and or but, such as The sun rises in the east, and it sets in the west. Keeping your writing full of clear, simple sentences - especially when explaining something new - makes it much easier for the reader to follow your ideas." },
  { id: 'g6-e-te-1', grade: 6, subject: 'English', language: 'te', title: 'Nouns మరియు Pronouns',
    summary: "Noun వ్యక్తులు, స్థలాలు, జంతువులు, వస్తువులను సూచిస్తుంది; pronoun (he, she, it) nounకు బదులుగా వాడి పునరావృతిని తగ్గిస్తుంది.",
    content: "Noun ఒక వ్యక్తి, స్థలం, జంతువు లేదా వస్తువును సూచిస్తుంది - teacher, village, dog, book వంటి పదాలు అన్నీ nounలే. Common noun సాధారణ వాటిని సూచిస్తుంది (boy, city), proper noun నిర్దిష్టమైన వాటిని సూచించి పెద్ద అక్షరంతో మొదలవుతుంది (Ravi, Hyderabad), collective noun ఒక సమూహాన్ని సూచిస్తుంది (a herd of cattle). Pronoun అనేది nounకు బదులుగా వాడే పదం, దీనివల్ల మనం దాన్ని మళ్లీ మళ్లీ చెప్పాల్సిన అవసరం ఉండదు - he, she, it, they వంటివి pronounలు. ఉదాహరణకు Priya వెళ్లింది Priya స్కూలుకు ఎందుకంటే Priya మర్చిపోయింది Priya బ్యాగ్ అని కాకుండా, Priya వెళ్లింది తన స్కూలుకు ఎందుకంటే ఆమె మర్చిపోయింది తన బ్యాగ్ అంటే బాగుంటుంది." },
  { id: 'g6-e-te-2', grade: 6, subject: 'English', language: 'te', title: 'సాధారణ వాక్యాలు',
    summary: "Simple sentenceలో ఒక subject, ఒక verb ఉండి ఒకే ఆలోచనను తెలియజేస్తుంది; compound sentence రెండు ఆలోచనలను కలుపుతుంది.",
    content: "Simple sentenceలో ఒక subject, ఒక verb ఉంటాయి, ఇది ఒక పూర్తి ఆలోచనను తెలియజేస్తుంది - ఉదాహరణకు The sun rises in the east. ఇక్కడ the sun subject (వాక్యం దేని గురించి మాట్లాడుతుందో), rises verb (జరిగే చర్య). Simple sentenceలో అదనపు వివరాలు కూడా ఉండవచ్చు, కానీ ఒకే ప్రధాన subject-verb జత ఉండాలి: The bright sun rises slowly in the east every morning. Simple sentenceలు compound sentenceల కంటే వేరు, compound sentenceలు రెండు పూర్తి ఆలోచనలను and లేదా but వంటి పదాలతో కలుపుతాయి, The sun rises in the east, and it sets in the west వంటివి." },
  { id: 'g6-e-hi-1', grade: 6, subject: 'English', language: 'hi', title: 'Noun और Pronoun',
    summary: "Noun व्यक्तियों, स्थानों, जानवरों, वस्तुओं का नाम बताता है; pronoun (he, she, it) noun की जगह लेकर दोहराव कम करता है।",
    content: "Noun किसी व्यक्ति, स्थान, जानवर या वस्तु का नाम बताता है - teacher, village, dog, book जैसे शब्द सभी noun हैं। Common noun सामान्य चीज़ों के नाम बताता है (boy, city), proper noun किसी खास चीज़ का नाम बताता है और बड़े अक्षर से शुरू होता है (Ravi, Hyderabad), collective noun किसी समूह का नाम बताता है (a herd of cattle)। Pronoun वह शब्द है जो noun की जगह इस्तेमाल होता है ताकि उसे बार-बार न दोहराना पड़े - he, she, it, they जैसे शब्द pronoun हैं। जैसे प्रिया गई प्रिया के स्कूल क्योंकि प्रिया भूल गई प्रिया का बैग कहने के बजाय, प्रिया अपने स्कूल गई क्योंकि वह अपना बैग भूल गई कहना ज़्यादा स्वाभाविक लगता है।" },
  { id: 'g6-e-hi-2', grade: 6, subject: 'English', language: 'hi', title: 'सरल वाक्य',
    summary: "Simple sentence में एक subject और एक verb होकर एक विचार व्यक्त होता है; compound sentence दो विचारों को जोड़ता है।",
    content: "Simple sentence में एक subject और एक verb होता है, और यह एक पूरा विचार व्यक्त करता है - जैसे The sun rises in the east. यहाँ the sun subject है, वाक्य किसके बारे में है, rises verb है, हो रही क्रिया। Simple sentence में अतिरिक्त जानकारी भी हो सकती है, बशर्ते एक ही मुख्य subject-verb जोड़ी हो: The bright sun rises slowly in the east every morning. Simple sentence, compound sentence से अलग होता है, जो and या but जैसे शब्दों से दो पूरे विचारों को जोड़ता है, जैसे The sun rises in the east, and it sets in the west." },

  { id: 'g6-ss-en-1', grade: 6, subject: 'Social Studies', language: 'en', title: 'Our Country India',
    summary: "India has 28 states and 8 union territories, each with its own language and traditions, united under one central government and constitution.",
    content: "India is a large country located in South Asia, bordered by countries such as Pakistan, China, Nepal, Bangladesh, and Myanmar, with a long coastline along the Arabian Sea and the Bay of Bengal. It is made up of 28 states and 8 union territories, each with its own regional government, and often its own dominant language, festivals, food, and cultural traditions. Despite this enormous diversity - India is home to hundreds of languages and multiple major religions - the country is united under one central government, one constitution, and a shared sense of national identity. New Delhi is the national capital, where the Parliament of India makes laws for the whole country. Learning about India's states and their unique traditions helps you appreciate how such a diverse country manages to function as a single, unified nation." },
  { id: 'g6-ss-en-2', grade: 6, subject: 'Social Studies', language: 'en', title: 'Types of Houses',
    summary: "House types vary with climate and materials - mud houses in dry villages, stilt houses in flood zones, and concrete buildings in cities.",
    content: "People all over India build very different types of houses depending on the local climate, the materials that are easily available, and the risks of their area. In villages with hot, dry weather, houses are often made from mud, straw, and wood, which keep the inside cool during the day. In regions that flood often, such as parts of Assam and Kerala's backwaters, houses are built on tall stilts or wooden platforms so that rising water flows underneath rather than inside the home. In cold, mountainous areas, houses may have sloped roofs made of slate or wood to let heavy snow slide off easily. In cities, most houses and apartments are built from concrete, brick, and steel, which are strong, long-lasting, and allow buildings to be constructed many floors high to fit more people into a smaller area of land." },
  { id: 'g6-ss-te-1', grade: 6, subject: 'Social Studies', language: 'te', title: 'మన దేశం భారతదేశం',
    summary: "భారతదేశంలో 28 రాష్ట్రాలు, 8 కేంద్రపాలిత ప్రాంతాలు ఉన్నాయి, ఒక్కోటి తనదైన భాష, సంప్రదాయాలతో ఒకే కేంద్ర ప్రభుత్వం కింద ఐక్యంగా ఉన్నాయి.",
    content: "భారతదేశం దక్షిణాసియాలో ఉన్న ఒక పెద్ద దేశం, పాకిస్తాన్, చైనా, నేపాల్, బంగ్లాదేశ్, మయన్మార్ వంటి దేశాలతో సరిహద్దులు కలిగి, అరేబియా సముద్రం, బంగాళాఖాతం వెంబడి పొడవైన తీరప్రాంతం కలిగి ఉంది. దీనిలో 28 రాష్ట్రాలు, 8 కేంద్రపాలిత ప్రాంతాలు ఉన్నాయి, ప్రతి దానికి తనదైన ప్రాంతీయ ప్రభుత్వం, ప్రధాన భాష, పండుగలు, ఆహారం, సంస్కృతి ఉంటాయి. ఇంత వైవిధ్యం ఉన్నప్పటికీ - భారతదేశంలో వందలాది భాషలు, అనేక ప్రధాన మతాలు ఉన్నప్పటికీ - దేశం ఒకే కేంద్ర ప్రభుత్వం, ఒకే రాజ్యాంగం కింద ఐక్యంగా ఉంది. న్యూ ఢిల్లీ దేశ రాజధాని, అక్కడ భారత పార్లమెంట్ దేశం మొత్తానికి చట్టాలు చేస్తుంది." },
  { id: 'g6-ss-te-2', grade: 6, subject: 'Social Studies', language: 'te', title: 'ఇళ్ల రకాలు',
    summary: "వాతావరణం, సామగ్రిని బట్టి ఇళ్ల రకాలు మారతాయి - పొడి గ్రామాల్లో మట్టి ఇళ్లు, వరద ప్రాంతాల్లో స్తంభాల ఇళ్లు, నగరాల్లో కాంక్రీట్ భవనాలు.",
    content: "భారతదేశం అంతటా ప్రజలు స్థానిక వాతావరణం, సులభంగా దొరికే సామగ్రి, ప్రాంత ప్రమాదాలను బట్టి వేర్వేరు రకాల ఇళ్లను నిర్మిస్తారు. వేడి, పొడి వాతావరణం ఉన్న గ్రామాల్లో ఇళ్లు తరచుగా మట్టి, గడ్డి, కర్రతో నిర్మిస్తారు, ఇవి పగటిపూట లోపల చల్లగా ఉంచుతాయి. అస్సాం, కేరళ బ్యాక్ వాటర్స్ వంటి తరచుగా వరదలొచ్చే ప్రాంతాల్లో ఇళ్లను ఎత్తైన స్తంభాలు లేదా చెక్క వేదికల మీద నిర్మిస్తారు, తద్వారా పెరిగే నీరు ఇంటి కింద నుండి ప్రవహిస్తుంది. చల్లని, పర్వత ప్రాంతాల్లో ఇళ్లకు వాలుగా ఉండే పైకప్పులు ఉంటాయి, తద్వారా భారీ మంచు సులభంగా జారిపోతుంది. నగరాల్లో ఎక్కువ ఇళ్లు కాంక్రీట్, ఇటుక, ఉక్కుతో నిర్మిస్తారు." },
  { id: 'g6-ss-hi-1', grade: 6, subject: 'Social Studies', language: 'hi', title: 'हमारा देश भारत',
    summary: "भारत में 28 राज्य और 8 केंद्र शासित प्रदेश हैं, प्रत्येक की अपनी भाषा और परंपराएँ हैं, फिर भी सब एक केंद्र सरकार और संविधान के तहत एकजुट हैं।",
    content: "भारत दक्षिण एशिया में स्थित एक बड़ा देश है, जिसकी सीमाएँ पाकिस्तान, चीन, नेपाल, बांग्लादेश और म्यांमार जैसे देशों से लगती हैं, और अरब सागर व बंगाल की खाड़ी के साथ एक लंबी तटरेखा है। इसमें 28 राज्य और 8 केंद्र शासित प्रदेश हैं, हर एक की अपनी क्षेत्रीय सरकार, प्रमुख भाषा, त्योहार, भोजन और संस्कृति है। इतनी विविधता के बावजूद - भारत में सैकड़ों भाषाएँ और कई प्रमुख धर्म हैं - देश एक केंद्र सरकार और एक संविधान के तहत एकजुट है। नई दिल्ली देश की राजधानी है, जहाँ भारतीय संसद पूरे देश के लिए कानून बनाती है।" },
  { id: 'g6-ss-hi-2', grade: 6, subject: 'Social Studies', language: 'hi', title: 'घरों के प्रकार',
    summary: "जलवायु और सामग्री के अनुसार घर बदलते हैं - सूखे गाँवों में मिट्टी के घर, बाढ़ वाले इलाकों में खंभों पर घर, शहरों में कंक्रीट भवन।",
    content: "पूरे भारत में लोग स्थानीय जलवायु, आसानी से मिलने वाली सामग्री और क्षेत्र के खतरों के अनुसार अलग-अलग तरह के घर बनाते हैं। गर्म, सूखी जलवायु वाले गाँवों में घर अक्सर मिट्टी, घास-फूस और लकड़ी से बनाए जाते हैं, जो दिन में अंदर ठंडक बनाए रखते हैं। असम और केरल के बैकवाटर जैसे बार-बार बाढ़ आने वाले इलाकों में घर ऊँचे खंभों या लकड़ी के चबूतरों पर बनाए जाते हैं, ताकि बढ़ता पानी घर के नीचे से बह सके। ठंडे, पहाड़ी इलाकों में घरों की छतें ढलानदार बनाई जाती हैं ताकि भारी बर्फ आसानी से फिसल जाए। शहरों में ज़्यादातर घर कंक्रीट, ईंट और स्टील से बनाए जाते हैं।" },

  { id: 'g6-tel-en-1', grade: 6, subject: 'Telugu', language: 'en', title: 'Telugu Vowels (Achulu)',
    summary: "Telugu has 16 vowels (achulu) in short and long forms, which combine with consonants to form every word in the language.",
    content: "Telugu vowels are called achulu, and there are 16 of them in total. They include short vowels such as a, i, u, e, and o, as well as their corresponding long forms aa, ee, oo, ae, and oo written with a longer sound, plus a couple of special vowels found in older or borrowed words. Vowels can stand on their own at the beginning of a word, or attach to a consonant as a small mark called a gunintam, which changes the consonant's sound without changing its basic shape too much. Every Telugu word is built by combining consonants with these vowel sounds in different patterns, much like English words are built from letters, and learning all 16 vowels by sight and sound is the essential first step to reading and writing Telugu confidently." },
  { id: 'g6-tel-en-2', grade: 6, subject: 'Telugu', language: 'en', title: 'Common Telugu Words',
    summary: "Everyday Telugu words like Amma (mother), Neeru (water), Pustakam (book) and Randi (please come) help build vocabulary through daily use.",
    content: "Building a small vocabulary of everyday words is one of the most enjoyable ways to start reading and speaking a new language. In Telugu, Amma means mother, Nanna means father, Akka means older sister, and Thammudu means younger brother - useful words for talking about family. Neeru means water, Annam means rice or food, and Pustakam means book, which are common words used at home and school. Simple action words are useful too: Randi means please come, and Kurchondi means please sit, both polite and commonly heard in daily life. Practicing these words in short sentences, like Amma, neeru kavali, meaning Mother, I want water, helps connect vocabulary to real situations, which makes the words much easier to remember than studying them as an isolated list." },
  { id: 'g6-tel-te-1', grade: 6, subject: 'Telugu', language: 'te', title: 'తెలుగు అచ్చులు',
    summary: "తెలుగులో 16 అచ్చులు (achulu) హ్రస్వ, దీర్ఘ రూపాల్లో ఉంటాయి, ఇవి హల్లులతో కలిసి ప్రతి పదాన్ని ఏర్పరుస్తాయి.",

// ---------- shared database ----------
// Accounts live in Claude's shared artifact storage (window.storage with
// shared:true) so every student who opens this page sees the SAME roster —
// that's what lets you and a friend show up on each other's leaderboard.
// If this file is opened outside of Claude (window.storage isn't available),
// it quietly falls back to this browser's local storage instead, so the demo
// still works — it just won't be shared with anyone else in that case.
var HAS_SHARED_STORAGE = (typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function');
var LOCAL_PREFIX = 'equ_user_';

async function dbGetUser(username) {
  if (HAS_SHARED_STORAGE) {
    try { var r = await window.storage.get('user:' + username, true); return r ? JSON.parse(r.value) : null; }
    catch (e) { return null; }
  }
  try { var raw = localStorage.getItem(LOCAL_PREFIX + username); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
async function dbSetUser(username, record) {
  if (HAS_SHARED_STORAGE) {
    try { await window.storage.set('user:' + username, JSON.stringify(record), true); } catch (e) { /* ignore */ }
    return;
  }
  try { localStorage.setItem(LOCAL_PREFIX + username, JSON.stringify(record)); } catch (e) { /* ignore */ }
}
async function dbDeleteUser(username) {
  if (HAS_SHARED_STORAGE) {
    try { await window.storage.delete('user:' + username, true); } catch (e) { /* ignore */ }
    return;
  }
  try { localStorage.removeItem(LOCAL_PREFIX + username); } catch (e) { /* ignore */ }
}
async function dbListUsers() {
  if (HAS_SHARED_STORAGE) {
    try {
      var res = await window.storage.list('user:', true);
      var keys = (res && res.keys) || [];
      var out = [];
      for (var i = 0; i < keys.length; i++) {
        try {
          var r = await window.storage.get(keys[i], true);
          if (r && r.value) out.push({ username: keys[i].slice(5), record: JSON.parse(r.value) });
        } catch (e) { /* skip unreadable entry */ }
      }
      return out;
    } catch (e) { return []; }
  }
  var out2 = [];
  try {
    for (var j = 0; j < localStorage.length; j++) {
      var k = localStorage.key(j);
      if (k && k.indexOf(LOCAL_PREFIX) === 0) {
        try { out2.push({ username: k.slice(LOCAL_PREFIX.length), record: JSON.parse(localStorage.getItem(k)) }); } catch (e) { /* skip */ }
      }
    }
  } catch (e) { /* storage unavailable */ }
  return out2;
}

// One-time wipe of every account and student record from a previous version
// of this site, so this release starts as a completely fresh, empty roster.
// A flag is stored once the wipe has run so it never repeats on later visits.
var RESET_FLAG_KEY = 'reset_v3_done';
async function performOneTimeReset() {
  if (HAS_SHARED_STORAGE) {
    try {
      var flag = await window.storage.get(RESET_FLAG_KEY, true);
      if (flag && flag.value === '1') return;
    } catch (e) { /* not set yet — proceed with the wipe */ }
    try {
      var res = await window.storage.list('user:', true);
      var keys = (res && res.keys) || [];
      for (var i = 0; i < keys.length; i++) {
        try { await window.storage.delete(keys[i], true); } catch (e) { /* already gone */ }
      }
      await window.storage.set(RESET_FLAG_KEY, '1', true);
    } catch (e) { /* ignore — worst case the wipe retries next load */ }
    return;
  }
  try {
    if (localStorage.getItem(RESET_FLAG_KEY) === '1') return;
    for (var j = localStorage.length - 1; j >= 0; j--) {
      var k = localStorage.key(j);
      if (k && k.indexOf(LOCAL_PREFIX) === 0) localStorage.removeItem(k);
    }
    localStorage.setItem(RESET_FLAG_KEY, '1');
  } catch (e) { /* storage unavailable */ }
}
