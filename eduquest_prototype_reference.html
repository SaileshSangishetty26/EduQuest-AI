// Saves the live session (progress, points, completed lessons) back into the
// shared account record, then refreshes the leaderboard so everyone's view
// of everyone else stays current.
async function persistUser() {
  if (!state.user) return;
  var record = {
    password: state.user.password,
    name: state.user.name,
    grade: state.user.grade,
    language: state.user.language,
    points: state.user.points,
    level: state.user.level,
    badges: state.user.badges.slice(),
    completed: Object.assign({}, state.completed),
  };
  await dbSetUser(state.user.username, record);
  refreshLeaderboard();
}

// Pulls every registered student from the shared store, sorted by XP.
async function refreshLeaderboard() {
  state.leaderboardLoading = true;
  if (state.screen === 'leaderboard') render();
  var all = await dbListUsers();
  var records = all.map(function (item) {
    return { username: item.username, name: item.record.name || item.username, points: item.record.points || 0, level: item.record.level || 1, badges: item.record.badges || [] };
  });
  records.sort(function (a, b) { return b.points - a.points; });
  state.leaderboardData = records;
  state.leaderboardLoading = false;
  if (state.screen === 'leaderboard') render();
}

// ---------- backend-equivalent grading ----------
function gradeAttempt(quiz, answers) {
  var correct = 0;
  for (var i = 0; i < quiz.questions.length; i++) { if (answers[i] === quiz.questions[i].correct) correct++; }
  var score = Math.round((correct / quiz.questions.length) * 10000) / 100;
  var pointsEarned = Math.floor(score / 10) * 5;
  return { score: score, correct: correct, total: quiz.questions.length, pointsEarned: pointsEarned };
}
function applyGamification(user, result) {
  user.points += result.pointsEarned;
  user.level = 1 + Math.floor(user.points / 100);
  if (result.score === 100 && user.badges.indexOf('Perfect Score') === -1) user.badges.push('Perfect Score');
}
function overallProgressPct() {
  var f = state.lessonFilters;
  var subjLessons = LESSONS.filter(function (l) { return l.grade === f.grade && l.language === f.language; });
  var total = subjLessons.length;
  var done = subjLessons.filter(function (l) { return state.completed[l.id]; }).length;
  return total ? Math.round((done / total) * 100) : 0;
}

function calendarHtml() {
  var c = state.calendar;
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var firstDow = new Date(c.year, c.month, 1).getDay();
  var daysInMonth = new Date(c.year, c.month + 1, 0).getDate();
  var isCurrentMonth = (c.year === today.getFullYear() && c.month === today.getMonth());
  var dows = ['Su','Mo','Tu','We','Th','Fr','Sa'].map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');
  var cells = '';
  for (var i = 0; i < firstDow; i++) cells += '<div class="cal-day muted"></div>';
  for (var d = 1; d <= daysInMonth; d++) {
    var isToday = isCurrentMonth && d === today.getDate();
    cells += '<div class="cal-day' + (isToday ? ' today' : '') + '">' + d + '</div>';
  }
  return '<div class="card calendar-card"><div class="cal-head"><h4>' + monthNames[c.month] + ' ' + c.year + '</h4>' +
    '<div class="cal-nav"><button data-action="cal-prev">' + ICONS.chevL + '</button><button data-action="cal-next">' + ICONS.chevR + '</button></div></div>' +
    '<div class="cal-grid">' + dows + cells + '</div></div>';
}

function lessonsPanelHtml() {
  var f = state.lessonFilters;
  var rows = SUBJECTS.map(function (subj) {
    var count = LESSONS.filter(function (l) { return l.grade === f.grade && l.language === f.language && l.subject === subj; }).length;
    var color = subjectColorVar(subj);
    return '<div class="lp-item"><div class="lp-bar" style="background:' + color + '"></div>' +
      '<div class="lp-top"><div><div class="lp-name">' + subj + '</div><div class="lp-sub">Grade ' + f.grade + ' \u00b7 ' + count + ' lessons</div></div>' +
      '<button class="lp-go" data-goto-subject="' + subj + '">' + ICONS.arrowR + '</button></div></div>';
  }).join('');
  return '<div class="card lessons-panel"><div class="card-head"><h3>Lessons</h3><a class="view-all" data-nav="lessons">View All</a></div>' + rows + '</div>';
}

  var donutStyle = 'background: conic-gradient(var(--blue) 0% ' + pct + '%, var(--gray-soft) ' + pct + '% 100%);';

  return '<div class="page-head"><span class="eyebrow">Overview</span><h2>Dashboard</h2>' +
    '<p>Here\u2019s how your learning is going today.</p></div>' +
    '<div class="dash-grid">' +
    '<div>' +
    '<div class="card welcome-card"><div><h2>Welcome back, <span class="hl-blue">' + (u ? (u.name || u.username) : 'Student') + '</span>!</h2>' +
    '<p>You\u2019ve completed <span class="hl-orange">' + pct + '%</span> of your Grade ' + f.grade + ' lessons.</p>' +
    '<p style="margin-top:2px">Progress is <span class="hl-orange">' + (pct >= 70 ? 'excellent' : pct >= 40 ? 'good' : 'just getting started') + '!</span></p></div>' +
    '<div class="wc-icon">' + ICONS.cap + '</div></div>' +

    '<div class="donut-wrap"><div class="donut" style="' + donutStyle + '"><span class="donut-label">' + pct + '%</span></div>' +
    '<div class="donut-legend"><span><span class="lg-dot" style="background:var(--gray-soft)"></span>Remaining</span><span><span class="lg-dot" style="background:var(--blue)"></span>Done</span></div></div></div>' +
    '<div class="cta-row">' +
    '<div class="cta-card orange"><h3>Continue Learning</h3><p>Pick up right where you left off across all subjects.</p><button class="btn-light" data-nav="lessons">Go to Lessons</button></div>' +
    '<div class="cta-card blue"><h3>Test Yourself</h3><ul class="cta-links">' +
    '<li data-nav="quizzes">' + ICONS.arrowR + ' Practice quizzes</li>' +
    '<li data-nav="quizzes">' + ICONS.arrowR + ' Track your XP</li>' +
    '<li data-nav="leaderboard">' + ICONS.arrowR + ' Climb the leaderboard</li></ul></div>' +
    '</div>' +

function screenLessons() {
  var f = state.lessonFilters;
  var visible = LESSONS.filter(function (l) { return l.grade === f.grade && l.language === f.language && (f.subject === '' || l.subject === f.subject); });

  var subjOpts = '<option value="">All subjects</option>', langOpts = '';
  SUBJECTS.forEach(function (s) { subjOpts += '<option value="' + s + '"' + (s === f.subject ? ' selected' : '') + '>' + s + '</option>'; });
  LANGUAGES.forEach(function (l) { langOpts += '<option value="' + l.code + '"' + (l.code === f.language ? ' selected' : '') + '>' + l.label + '</option>'; });

  var progressCards = SUBJECTS.map(function (subj) {
    var subjLessons = LESSONS.filter(function (l) { return l.grade === f.grade && l.language === f.language && l.subject === subj; });
    var done = subjLessons.filter(function (l) { return state.completed[l.id]; }).length;
    var total = subjLessons.length;
    var pct = total === 0 ? 0 : Math.round((done / total) * 100);
    return '<div class="subject-progress ' + subjectClass(subj) + '"><div class="sp-top"><span class="sp-name">' + subj + '</span>' +
      '<span class="sp-count">' + done + ' / ' + total + '</span></div>' +
      '<div class="progress-track"><div class="progress-fill' + (pct === 100 && total > 0 ? ' complete' : '') + '" style="width:' + pct + '%"></div></div></div>';
  }).join('');

  var grid = visible.length === 0
    ? '<div class="empty-state">No lessons found for this grade, subject and language yet — try a different filter.</div>'
    : '<div class="lesson-grid">' + visible.map(function (l) {
        var done = !!state.completed[l.id];
        return '<div class="lesson-card ' + subjectClass(l.subject) + '" data-action="open-lesson" data-id="' + l.id + '">' +
          (done ? '<span class="check">\u2713</span>' : '') +
          '<span class="badge ' + subjectBadgeClass(l.subject) + '">' + l.subject + '</span>' +
          '<h3>' + l.title + '</h3><p class="excerpt">' + (l.summary || l.content.slice(0, 90) + '\u2026') + '</p></div>';
      }).join('') + '</div>';

  var openLesson = state.openLessonId ? LESSONS.find(function (l) { return l.id === state.openLessonId; }) : null;
  var reader = '';
  if (openLesson) {
    var isDone = !!state.completed[openLesson.id];
    reader = '<div class="card lesson-reader">' +
      '<span class="badge ' + subjectBadgeClass(openLesson.subject) + '">' + openLesson.subject + '</span><span class="badge">' + langLabel(openLesson.language) + '</span>' +
      '<h3 style="margin-top:10px">' + openLesson.title + '</h3>' +
      (openLesson.summary ? '<div class="lesson-summary-box"><strong>Summary:</strong> ' + openLesson.summary + '</div>' : '') +
      '<p style="margin-top:14px;line-height:1.7">' + openLesson.content + '</p>' +
      '<div class="reader-actions">' +
      '<button class="btn-secondary' + (isDone ? ' done' : '') + '" data-action="toggle-complete" data-id="' + openLesson.id + '">' +
      (isDone ? '\u2713 Completed' : 'Mark as complete') + '</button>' +
      '<button class="btn-secondary" data-action="ask-ai-about-lesson" data-id="' + openLesson.id + '">' + ICONS.chat + ' Ask AI about this</button>' +
      '<a data-action="close-lesson" style="color:var(--text-secondary);font-size:.86rem">Close</a>' +
      '</div></div>';
  }

  return '<div class="page-head"><span class="eyebrow">Learning path</span>' +
    '<h2>Lessons for Grade ' + f.grade + '</h2><p>Browse by subject and language, then mark each lesson complete as you go.</p></div>' +
    '<div class="card"><div class="filter-bar">' +
    '<div class="form-group"><label>Grade</label><select id="lesson-grade">' + gradeOptionsHtml(f.grade) + '</select></div>' +
    '<div class="form-group"><label>Subject</label><select id="lesson-subject">' + subjOpts + '</select></div>' +
    '<div class="form-group"><label>Language</label><select id="lesson-language">' + langOpts + '</select></div>' +
    '</div></div>' +
    '<div class="subject-grid">' + progressCards + '</div>' +
    grid + reader;
}

function screenQuizzes() {
  var filtered = QUIZZES.filter(function (q) { return q.grade === state.quizGrade; });

  var grid = filtered.length === 0
    ? '<div class="empty-state">No quizzes found for this grade yet — check back soon.</div>'
    : '<div class="lesson-grid">' + filtered.map(function (q) {
        return '<div class="lesson-card ' + subjectClass(q.subject) + '" style="cursor:default">' +
          '<span class="badge ' + subjectBadgeClass(q.subject) + '">' + q.subject + '</span><h3>' + q.title + '</h3>' +
          '<p class="excerpt">' + q.questions.length + ' questions</p>' +
          '<button class="btn-primary" data-action="start-quiz" data-id="' + q.id + '" style="margin-top:12px">Attempt quiz</button></div>';
      }).join('') + '</div>';

  return '<div class="page-head"><span class="eyebrow">Prove it</span>' +
    '<h2>Quizzes for Grade ' + state.quizGrade + '</h2><p>Clear a checkpoint to earn XP toward the leaderboard.</p></div>' +
    '<div class="card"><div class="form-group" style="max-width:220px"><label>Grade</label><select id="quiz-grade">' + gradeOptionsHtml(state.quizGrade) + '</select></div></div>' +
    grid;
}

function screenAttempt() {
  var quiz = state.activeQuiz;
  if (!quiz) return screenQuizzes();
  var answeredCount = state.answers.filter(function (a) { return a !== null; }).length;
  var dots = quiz.questions.map(function (_, i) { return '<span class="dot' + (state.answers[i] !== null ? ' answered' : '') + '"></span>'; }).join('');
  var questions = quiz.questions.map(function (q, qi) {
    var opts = q.options.map(function (opt, oi) {
      return '<div class="quiz-option' + (state.answers[qi] === oi ? ' selected' : '') + '" data-action="answer" data-q="' + qi + '" data-o="' + oi + '">' +
        '<span class="mark"></span>' + opt + '</div>';
    }).join('');
    return '<div class="quiz-question"><span class="q-label">Question ' + (qi + 1) + '</span><p class="q-text">' + q.text + '</p>' + opts + '</div>';
  }).join('');

  return '<div style="max-width:600px">' +
    '<div class="page-head"><span class="eyebrow">Checkpoint</span><h2>' + quiz.title + '</h2>' +
    '<p>' + answeredCount + ' of ' + quiz.questions.length + ' answered</p></div>' +
    '<div class="quiz-progress">' + dots + '</div>' +
    '<div class="card">' + questions +
    (state.quizError ? '<p class="error-text">' + state.quizError + '</p>' : '') +
    '<button class="btn-primary" data-action="submit-quiz" style="margin-top:6px">Submit quiz</button></div></div>';
}

function screenResult() {
  var r = state.lastResult;
  if (!r) return screenQuizzes();
  return '<div style="max-width:420px"><div class="card dark" style="text-align:center">' +
    '<span class="eyebrow" style="color:var(--orange)">Checkpoint cleared</span><h2>Quiz result</h2>' +
    '<p class="result-score">' + r.score + '%</p>' +
    '<p style="color:rgba(255,255,255,.8)">' + r.correct + '/' + r.total + ' correct</p>' +
    '<p style="margin:12px 0 18px"><span class="badge gold">+' + r.pointsEarned + ' XP</span></p>' +
    '<button class="btn-primary" data-action="back-to-quizzes">Back to quizzes</button></div></div>';
}

function screenLeaderboard() {
  var board = state.leaderboardData;
  var loadingNote = (!board && state.leaderboardLoading) ? '<p style="color:var(--text-secondary);font-size:.88rem;margin-bottom:14px">Loading everyone\u2019s scores\u2026</p>' : '';
  var all = (board || []).map(function (row) {
    return { username: row.username, name: row.name, points: row.points, level: row.level, you: state.user && row.username === state.user.username };
  });
  all.sort(function (a, b) { return b.points - a.points; });
  all.forEach(function (row, i) { row.rank = i + 1; });
  var top3 = all.slice(0, 3), rest = all.slice(3);

  var profileCard = state.user
    ? '<div class="card"><h3>Your progress</h3><p><span class="badge badge-math">Level ' + state.user.level + '</span>' +
      '<span class="badge green">' + state.user.points + ' XP</span></p>' +
      (state.user.badges.length ? '<p style="margin-top:10px">' + state.user.badges.map(function (b) { return '<span class="badge gold">' + b + '</span>'; }).join('') + '</p>' : '') +
      '</div>' : '';

  var podium = top3.length ? '<div class="card dark"><div class="podium">' + top3.map(function (row) {
    return '<div class="podium-slot' + (row.you ? ' you' : '') + '"><span class="rank">#' + row.rank + '</span>' +
      '<div class="name">' + row.name + (row.you ? ' (you)' : '') + '</div>' +
      '<span class="xp">' + row.points + ' XP \u00b7 Lvl ' + row.level + '</span></div>';
  }).join('') + '</div></div>' : '';

  var restRows = rest.map(function (row) {
    return '<div class="leaderboard-row' + (row.you ? ' you' : '') + '"><span><span class="rank">#' + row.rank + '</span>' +
      row.name + (row.you ? ' (you)' : '') + '</span><span class="points">' + row.points + ' XP \u00b7 Lvl ' + row.level + '</span></div>';
  }).join('');

  var emptyNote = (board && board.length === 0) ? '<p style="color:var(--text-secondary)">No one has registered yet \u2014 invite a friend to join!</p>' : '';

  return '<div class="page-head"><span class="eyebrow">Standings</span><h2>Leaderboard</h2>' +
    '<p>Every registered student shows up here \u2014 clear a quiz to climb it.</p></div>' + loadingNote + profileCard + podium +
    '<div class="card">' + (restRows || emptyNote || '<p style="color:var(--text-secondary)">No scores yet.</p>') + '</div>';
}

  var confirmBox = state.confirmDeleteAccount
    ? '<div class="confirm-box"><p>This permanently deletes your account and all saved progress. This can\u2019t be undone \u2014 are you sure?</p>' +
      '<div class="confirm-actions"><button class="btn-danger" data-action="confirm-delete-account">' + ICONS.trash + 'Yes, delete my account</button>' +
      '<button class="btn-outline" data-action="cancel-delete-account">Cancel</button></div></div>'
    : '<button class="btn-danger" data-action="ask-delete-account">' + ICONS.trash + 'Delete account</button>';

  return '<div class="page-head"><span class="eyebrow">Account</span><h2>Your Profile</h2><p>View and update your details.</p></div>' +
    '<div class="card">' +
    '<div class="profile-head"><div class="avatar">' + initials(u.name || u.username) + '</div>' +
    '<div><div class="p-name">' + (u.name || u.username) + '</div><div class="p-sub">@' + u.username + '</div></div></div>' +
    '<div class="profile-stats"><span class="badge badge-math">Level ' + u.level + '</span><span class="badge green">' + u.points + ' XP</span><span class="badge">Grade ' + u.grade + '</span><span class="badge">' + langLabel(u.language) + '</span></div>' +
    '</div>' +
    '<div class="card">' +
    '<div class="card-head"><h3>' + ICONS.pencil + ' Edit details</h3></div>' +
    (state.profileError ? '<p class="error-text">' + state.profileError + '</p>' : '') +
    (state.profileNotice ? '<p class="success-text">' + state.profileNotice + '</p>' : '') +
    '<div class="form-group"><label>Full name</label><input id="profile-name" value="' + (u.name || '') + '" /></div>' +
    '<div class="form-group" style="margin-top:14px"><label>Grade</label><select id="profile-grade">' + gradeOptionsHtml(u.grade) + '</select></div>' +
    '<div class="form-group" style="margin-top:14px"><label>Preferred language</label><select id="profile-language">' + langOpts + '</select></div>' +
    '<button class="btn-primary" data-action="save-profile" style="margin-top:16px">Save changes</button>' +
    '</div>' +
    '<div class="card danger-card">' +
    '<h3>' + ICONS.trash + ' Delete account</h3>' +
    '<p>Removes your account, grade/language settings, points and lesson progress from the shared database for good.</p>' +
    confirmBox +
    '</div>';
}

// ---------- render ----------
function render() {
  var body = '';
  switch (state.screen) {
    case 'login': body = screenLogin(); break;
    case 'register': body = screenRegister(); break;
    case 'dashboard': body = screenDashboard(); break;
    case 'lessons': body = screenLessons(); break;
    case 'quizzes': body = screenQuizzes(); break;
    case 'attempt': body = screenAttempt(); break;
    case 'result': body = screenResult(); break;
    case 'leaderboard': body = screenLeaderboard(); break;
    case 'profile': body = screenProfile(); break;
  }
  var app = qs('#app');
  if (state.user) {
    app.className = 'app-shell';
    app.innerHTML = renderSidebar() + '<div class="main-col">' + renderTopbar() + '<div class="page-scroll">' + body + '</div></div>' + renderChatWidget();
    var chatBody = qs('.chat-body');
    if (chatBody) chatBody.scrollTop = chatBody.scrollHeight;
  } else {
    app.className = 'app-shell auth-mode';
    app.innerHTML = '<div class="auth-center">' + body + '</div>';
  }
  wireEvents();
}

// ---------- AI doubt-clarification chatbot ----------
function chatSystemPrompt() {
  var langName = langLabel(state.user.language);
  var lessonNote = '';
  if (state.chatLessonContext) {
    lessonNote = ' The student just opened a lesson titled "' + state.chatLessonContext.title + '" (' + state.chatLessonContext.subject + '), which says: ' + state.chatLessonContext.content;
  }
  return 'You are EduQuest\u2019s friendly AI tutor, helping a Grade ' + state.user.grade + ' student named ' +
    (state.user.name || state.user.username) + ' clear doubts about their school lessons (Mathematics, Science, English, Social Studies, Telugu).' +
    ' The student\u2019s preferred language is ' + langName + ' \u2014 reply in ' + langName + ' unless they write in a different language, in which case follow their language.' +
    ' Keep answers short, simple, encouraging, and appropriate for a child of this age. Use small examples where helpful.' +
    lessonNote;
}
function renderChatWidget() {
  var msgs = state.chatMessages.map(function (m) {
    return '<div class="chat-msg ' + m.role + '">' + escapeHtml(m.content) + '</div>';
  }).join('') + (state.chatSending ? '<div class="chat-msg pending">Thinking\u2026</div>' : '');
  var body = state.chatMessages.length === 0 && !state.chatSending
    ? '<div class="chat-empty">Hi ' + (state.user.name || state.user.username) + '! Ask me anything you\u2019re stuck on in your lessons \u2014 I\u2019m here to help.</div>'
    : msgs;
  var panel = state.chatOpen ? (
    '<div class="chat-panel">' +
    '<div class="chat-head"><div><h4>EduQuest AI Tutor</h4><p>Doubt clarification \u00b7 Grade ' + state.user.grade + '</p></div>' +
    '<button data-action="close-chat" title="Close">' + ICONS.close + '</button></div>' +
    '<div class="chat-body">' + body + '</div>' +
    (state.chatError ? '<p class="error-text" style="padding:0 12px">' + escapeHtml(state.chatError) + '</p>' : '') +
    '<div class="chat-input-row">' +
    '<textarea id="chat-input" rows="1" placeholder="Type your question\u2026"></textarea>' +
    '<button class="chat-send-btn" data-action="send-chat"' + (state.chatSending ? ' disabled' : '') + '>' + ICONS.send + '</button>' +
    '</div></div>'
  ) : '';
  return panel + '<button class="chat-fab" data-action="toggle-chat" title="Ask AI a doubt">' + ICONS.chat + '</button>';
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
async function sendChatMessage(text) {
  var trimmed = (text || '').trim();
  if (!trimmed || state.chatSending) return;
  state.chatMessages.push({ role: 'user', content: trimmed });
  state.chatSending = true;
  state.chatError = '';
  render();

  var apiMessages = state.chatMessages.map(function (m) { return { role: m.role, content: m.content }; });

  try {
    var response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: chatSystemPrompt(),
        messages: apiMessages,
      }),
    });
    var data = await response.json();
    var replyText = (data && data.content || []).map(function (b) { return b.type === 'text' ? b.text : ''; }).filter(Boolean).join('\n');
    if (!replyText) replyText = 'Sorry, I could not think of an answer just now \u2014 please try asking again.';
    state.chatMessages.push({ role: 'assistant', content: replyText });
  } catch (e) {
    state.chatError = 'Could not reach the AI tutor. Please check your connection and try again.';
  }
  state.chatSending = false;
  state.chatLessonContext = null;
  render();
  dbSaveChat(state.user.username, state.chatMessages);
}

function goto(screen) {
  if (['dashboard', 'lessons', 'quizzes', 'leaderboard', 'attempt', 'result', 'profile'].indexOf(screen) !== -1 && !state.user) screen = 'login';
  if (screen === 'profile') { state.profileError = ''; state.profileNotice = ''; state.confirmDeleteAccount = false; }
  state.screen = screen;
  render();
  if (screen === 'leaderboard') refreshLeaderboard();
}

// ---------- events ----------
function wireEvents() {
  document.querySelectorAll('[data-nav]').forEach(function (n) { n.addEventListener('click', function () { goto(n.getAttribute('data-nav')); }); });
  document.querySelectorAll('[data-goto-subject]').forEach(function (n) {
    n.addEventListener('click', function () {
      state.lessonFilters.subject = n.getAttribute('data-goto-subject');
      state.openLessonId = null;
      goto('lessons');
    });
  });

  var logoutBtn = qs('[data-action="logout"]');
  if (logoutBtn) logoutBtn.addEventListener('click', function () { state.user = null; state.leaderboardData = null; state.chatMessages = []; state.chatOpen = false; goto('login'); });

  var loginBtn = qs('[data-action="login"]');
  if (loginBtn) loginBtn.addEventListener('click', function () {
    var username = (qs('#login-username').value || '').trim();
    var password = qs('#login-password').value || '';
    if (!username || !password) { state.loginError = 'Enter a username and password.'; render(); return; }
    state.loginError = '';
    state.loggingIn = true;
    render();

    dbGetUser(username).then(function (record) {
      if (record && record.password !== password) {
        state.loggingIn = false;
        state.loginError = 'Incorrect password for that username.';
        render();
        return;
      }
      var afterRecord = function (rec) {
        state.loggingIn = false;
        state.user = { username: username, password: rec.password, name: rec.name, grade: rec.grade, language: rec.language, points: rec.points, level: rec.level, badges: rec.badges.slice() };
        state.lessonFilters = { grade: rec.grade, subject: '', language: rec.language };
        state.completed = Object.assign({}, rec.completed);
        state.quizGrade = rec.grade;
        state.chatMessages = [];
        dbGetChat(username).then(function (msgs) { state.chatMessages = msgs || []; if (state.chatOpen) render(); });
        goto('dashboard');
      };
      if (!record) {
        // No account with this username yet — create one on the fly (defaults to Grade 7 / English),
        // matching how the demo used to behave, but now it's saved for everyone to see.
        var fresh = { password: password, name: username, grade: 7, language: 'en', points: 0, level: 1, badges: [], completed: {} };
        dbSetUser(username, fresh).then(function () { afterRecord(fresh); });
      } else {
        afterRecord(record);
      }
    });
  });

  var registerBtn = qs('[data-action="register"]');
  if (registerBtn) registerBtn.addEventListener('click', function () {
    var username = (qs('#reg-username').value || '').trim();
    var name = (qs('#reg-name').value || '').trim();
    var password = qs('#reg-password').value || '';
    var grade = Number(qs('#reg-grade').value);
    var language = qs('#reg-language').value;
    if (!name || !username || !password) { state.registerError = 'Fill in name, username and password.'; render(); return; }
    state.registerError = '';
    state.registering = true;
    render();

    dbGetUser(username).then(function (existing) {
      if (existing) {
        state.registering = false;
        state.registerError = 'That username is already taken — try logging in instead.';
        render();
        return;
      }
      var newRecord = { password: password, name: name, grade: grade, language: language, points: 0, level: 1, badges: [], completed: {} };
      dbSetUser(username, newRecord).then(function () {
        state.registering = false;
        state.registerNotice = 'Registered! Redirecting to login\u2026';
        render();
        setTimeout(function () { state.registerNotice = ''; goto('login'); }, 1100);
      });
    });
  });

  var lg = qs('#lesson-grade'); if (lg) lg.addEventListener('change', function () { state.lessonFilters.grade = Number(lg.value); state.openLessonId = null; render(); });
  var ls = qs('#lesson-subject'); if (ls) ls.addEventListener('change', function () { state.lessonFilters.subject = ls.value; state.openLessonId = null; render(); });
  var ll = qs('#lesson-language'); if (ll) ll.addEventListener('change', function () { state.lessonFilters.language = ll.value; state.openLessonId = null; render(); });

  document.querySelectorAll('[data-action="open-lesson"]').forEach(function (c) {
    c.addEventListener('click', function () { state.openLessonId = c.getAttribute('data-id'); render(); });
  });
  var closeLesson = qs('[data-action="close-lesson"]');
  if (closeLesson) closeLesson.addEventListener('click', function () { state.openLessonId = null; render(); });

  var toggleComplete = qs('[data-action="toggle-complete"]');
  if (toggleComplete) toggleComplete.addEventListener('click', function () {
    var id = toggleComplete.getAttribute('data-id');
    state.completed[id] = !state.completed[id];
    persistUser();
    render();
  });

  var qg = qs('#quiz-grade'); if (qg) qg.addEventListener('change', function () { state.quizGrade = Number(qg.value); render(); });

  document.querySelectorAll('[data-action="start-quiz"]').forEach(function (b) {
    b.addEventListener('click', function () {
      var quiz = QUIZZES.find(function (q) { return q.id === b.getAttribute('data-id'); });
      state.activeQuiz = quiz;
      state.answers = new Array(quiz.questions.length).fill(null);
      state.quizError = '';
      goto('attempt');
    });
  });

  document.querySelectorAll('[data-action="answer"]').forEach(function (o) {
    o.addEventListener('click', function () {
      state.answers[Number(o.getAttribute('data-q'))] = Number(o.getAttribute('data-o'));
      state.quizError = '';
      render();
    });
  });

  var submitQuiz = qs('[data-action="submit-quiz"]');
  if (submitQuiz) submitQuiz.addEventListener('click', function () {
    if (state.answers.some(function (a) { return a === null; })) { state.quizError = 'Please answer all questions before submitting.'; render(); return; }
    var result = gradeAttempt(state.activeQuiz, state.answers);
    applyGamification(state.user, result);
    persistUser();
    state.lastResult = result;
    goto('result');
  });

  var backToQuizzes = qs('[data-action="back-to-quizzes"]');
  if (backToQuizzes) backToQuizzes.addEventListener('click', function () { goto('quizzes'); });

  var calPrev = qs('[data-action="cal-prev"]');
  if (calPrev) calPrev.addEventListener('click', function () {
    state.calendar.month -= 1;
    if (state.calendar.month < 0) { state.calendar.month = 11; state.calendar.year -= 1; }
    render();
  });
  var calNext = qs('[data-action="cal-next"]');
  if (calNext) calNext.addEventListener('click', function () {
    state.calendar.month += 1;
    if (state.calendar.month > 11) { state.calendar.month = 0; state.calendar.year += 1; }
    render();
  });

  var themeToggle = qs('[data-action="toggle-theme"]');
  if (themeToggle) themeToggle.addEventListener('click', toggleTheme);

  var saveProfileBtn = qs('[data-action="save-profile"]');
  if (saveProfileBtn) saveProfileBtn.addEventListener('click', function () {
    var name = (qs('#profile-name').value || '').trim();
    var grade = Number(qs('#profile-grade').value);
    var language = qs('#profile-language').value;
    if (!name) { state.profileError = 'Name can\u2019t be empty.'; state.profileNotice = ''; render(); return; }

    var gradeChanged = grade !== state.user.grade;
    var languageChanged = language !== state.user.language;
    state.user.name = name;
    state.user.grade = grade;
    state.user.language = language;
    // If grade/language changed, move the lesson filters and re-check which
    // lessons still count as "completed" under the new grade/language.
    if (gradeChanged || languageChanged) {
      state.lessonFilters = { grade: grade, subject: '', language: language };
      state.quizGrade = grade;
      state.openLessonId = null;
    }
    state.profileError = '';
    state.profileNotice = 'Saved!';
    persistUser();
    render();
  });

  var askDelete = qs('[data-action="ask-delete-account"]');
  if (askDelete) askDelete.addEventListener('click', function () { state.confirmDeleteAccount = true; render(); });
  var cancelDelete = qs('[data-action="cancel-delete-account"]');
  if (cancelDelete) cancelDelete.addEventListener('click', function () { state.confirmDeleteAccount = false; render(); });
  var confirmDelete = qs('[data-action="confirm-delete-account"]');
  if (confirmDelete) confirmDelete.addEventListener('click', function () {
    var username = state.user.username;
    dbDeleteUser(username).then(function () {
      state.user = null;
      state.confirmDeleteAccount = false;
      state.profileError = '';
      state.profileNotice = '';
      state.leaderboardData = null;
      goto('login');
    });
  });
}

applyTheme();
performOneTimeReset().then(render);
</script>
</body>
</html>
